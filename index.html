// ---------------- Zufallsaufgaben („Neue Zahlen“) ----------------
(function(){
  const NAMES=[['Land A','Land B'],['Anna','Ben'],['Deutschland','Polen'],['Kiel','Lübeck'],['Firma Nord','Firma Süd'],['Spanien','Italien']];
  const GOODS=[['Kartoffeln','Fleisch'],['Hemden','Waschmaschinen'],['Uhren','Smartphones'],['Tuch','Wein'],['Brot','Kuchen'],['Fahrräder','Laptops']];
  const OUT=[4,5,6,8,10,12,15,16,20,24,30,32,40,48,60];
  const RAT=[0.25,0.5,1,2,3,4];
  const q=x=>deV(x);
  // Kopfrechen-Fall: Output pro 8-Stunden-Tag, ganze Zahlen, einfache Verhältnisse
  function kc(R){ for(let k=0;k<400;k++){ const nm=pickV(R,NAMES), g=pickV(R,GOODS), rA=pickV(R,RAT), rB=pickV(R,RAT); if(rA===rB) continue;
      const xA=pickV(R,OUT), xB=pickV(R,OUT), yA=xA*rA, yB=xB*rB; if(!OUT.includes(yA)||!OUT.includes(yB)||xA===xB||yA===yB) continue;
      return mk(nm,g,xA,yA,xB,yB,'pro Tag (8 Stunden)'); } }
  // Taschenrechner-Fall: Arbeiter mal Produktivität mit Dezimalzahlen
  function tc(R){ for(let k=0;k<400;k++){ const nm=pickV(R,NAMES.filter(x=>x[0]!=='Anna')), g=pickV(R,GOODS), WA=pickV(R,[80,100,120,150,200,250]), WB=pickV(R,[80,100,120,150,200,250]);
      const P=[1.2,1.5,1.8,2.4,2.5,3,3.5,3.6,4.2,4.5,5,6,6.3,7.5,8,9];
      const a=pickV(R,P),b=pickV(R,P),c=pickV(R,P),d=pickV(R,P); if(Math.abs(b/a-d/c)<0.15||a===c||b===d) continue;
      const t=mk(nm,g,WA*a,WA*b,WB*c,WB*d,'pro Jahr'); t.per={WA,WB,a,b,c,d}; t.intro=`${nm[0]} hat ${WA} Arbeiter, jeder schafft pro Jahr ${q(a)} ${g[0]} oder ${q(b)} ${g[1]}. ${nm[1]} hat ${WB} Arbeiter mit ${q(c)} ${g[0]} oder ${q(d)} ${g[1]}.`; return t; } }
  function mk(nm,g,xA,yA,xB,yB,per){
    const K={nm,g,xA,yA,xB,yB,okXA:yA/xA,okXB:yB/xB,okYA:xA/yA,okYB:xB/yB};
    K.cX=K.okXA<K.okXB?0:1; K.cY=1-K.cX; K.aX=xA>xB?0:1; K.aY=yA>yB?0:1;
    K.lo=Math.min(K.okXA,K.okXB); K.hi=Math.max(K.okXA,K.okXB);
    K.intro=`${nm[0]} kann ${per} ${q(xA)} ${g[0]} oder ${q(yA)} ${g[1]} herstellen, ${nm[1]} ${q(xB)} ${g[0]} oder ${q(yB)} ${g[1]}.`;
    K.fig=k=>ppfScene({L:[{n:nm[0],x:xA,y:yA},{n:nm[1],x:xB,y:yB}],xl:g[0],yl:g[1]});
    return K; }
  const who=(K,i)=>K.nm[i];
  const mcN=(R,text,c,dis,ex,fig)=>mcV(R,text,c,dis,ex,fig,q);
  const mcW=(R,text,i,K,ex)=>mcT(R,text,K.nm[i],[K.nm[1-i],'keiner von beiden','beide gleichermaßen'],ex,K.fig);
  const kT={
    max:R=>{ const m=pickV(R,[10,12,15,16,20,24,30,40,48,60]), g=pickV(R,GOODS)[0]; return mcN(R,`Eine Person braucht ${m} Minuten für 1 Einheit ${g} und arbeitet 8 Stunden. Wie viele Einheiten schafft sie höchstens?`,480/m,[480/m*2,m/8,60/m*4],`8 Stunden = 480 Minuten. 480 / ${m} = ${q(480/m)}.`); },
    half:R=>{ const K=kc(R); return mcT(R,`${K.intro} ${K.nm[0]} teilt die Zeit gleichmäßig auf. Was produziert ${K.nm[0]}?`,`${q(K.xA/2)} ${K.g[0]} und ${q(K.yA/2)} ${K.g[1]}`,[`${q(K.xA)} ${K.g[0]} und ${q(K.yA)} ${K.g[1]}`,`${q(K.xA/2)} ${K.g[0]} und ${q(K.yA)} ${K.g[1]}`,`${q(K.xA/4)} ${K.g[0]} und ${q(K.yA/4)} ${K.g[1]}`],`Mit halber Zeit schafft man jeweils die Hälfte des Maximums.`,K.fig); },
    slope:R=>{ const K=kc(R); return mcN(R,`${K.intro} Wie groß ist die Steigung der PMK von ${K.nm[1]} (${K.g[1]} pro Einheit ${K.g[0]}, ${K.g[0]} auf der waagerechten Achse)?`,-K.okXB,[-K.okYB,K.okXB,-K.okXA],`−${q(K.yB)} / ${q(K.xB)} = ${q(-K.okXB)}. Der Betrag der Steigung sind die Opportunitätskosten von ${K.g[0]}.`,K.fig); },
    point:R=>{ const K=kc(R), x1=K.xA/2; return mcN(R,`${K.intro} ${K.nm[0]} produziert ${q(x1)} ${K.g[0]}. Wie viel ${K.g[1]} ist dann höchstens möglich?`,K.yA/2,[K.yA,K.yA-x1,K.yA/4],`Die Hälfte der ${K.g[0]} braucht die Hälfte der Zeit. Es bleibt Zeit für ${q(K.yA/2)} ${K.g[1]}.`,K.fig); },
    okX:R=>{ const K=kc(R), i=R()<0.5?0:1; const v=i?K.okXB:K.okXA, w=i?K.okYB:K.okYA; return mcN(R,`${K.intro} Opportunitätskosten von 1 ${K.g[0]} für ${K.nm[i]} (in ${K.g[1]})?`,v,[w,i?K.okXA:K.okXB,v*2],`${q(i?K.yB:K.yA)} / ${q(i?K.xB:K.xA)} = ${q(v)} ${K.g[1]}. Der Kehrwert ${q(w)} sind die OK von 1 ${K.g[1]}.`,K.fig); },
    okY:R=>{ const K=kc(R), i=R()<0.5?0:1; const v=i?K.okYB:K.okYA, w=i?K.okXB:K.okXA; return mcN(R,`${K.intro} Opportunitätskosten von 1 ${K.g[1]} für ${K.nm[i]} (in ${K.g[0]})?`,v,[w,i?K.okYA:K.okYB,v/2],`${q(i?K.xB:K.xA)} / ${q(i?K.yB:K.yA)} = ${q(v)} ${K.g[0]}.`,K.fig); },
    absX:R=>{ const K=kc(R); return mcW(R,`${K.intro} Wer hat den absoluten Vorteil bei ${K.g[0]}?`,K.aX,K,`${q(Math.max(K.xA,K.xB))} > ${q(Math.min(K.xA,K.xB))}: mehr Output bei gleicher Zeit.`); },
    compX:R=>{ const K=kc(R); return mcW(R,`${K.intro} Wer hat den komparativen Vorteil bei ${K.g[0]}?`,K.cX,K,`OK von 1 ${K.g[0]}: ${K.nm[0]} ${q(K.okXA)}, ${K.nm[1]} ${q(K.okXB)} ${K.g[1]}. Die geringeren OK hat ${K.nm[K.cX]}.`); },
    compY:R=>{ const K=kc(R); return mcW(R,`${K.intro} Wer hat den komparativen Vorteil bei ${K.g[1]}?`,K.cY,K,`OK von 1 ${K.g[1]}: ${K.nm[0]} ${q(K.okYA)}, ${K.nm[1]} ${q(K.okYB)} ${K.g[0]}. Die geringeren OK hat ${K.nm[K.cY]}.`); },
    spec:R=>{ const K=kc(R); return {t:'sort',text:`${K.intro} Worauf spezialisiert sich wer?`,items:[[K.nm[0],K.cX===0?0:1,[K.g[0],K.g[1]]],[K.nm[1],K.cX===1?0:1,[K.g[0],K.g[1]]]],ex:`Jeder auf das Gut mit den geringeren Opportunitätskosten: ${K.nm[K.cX]} auf ${K.g[0]}, ${K.nm[K.cY]} auf ${K.g[1]}.`,fig:K.fig}; },
    intv:R=>{ const K=kc(R); return mcT(R,`${K.intro} In welchem Bereich muss der Preis für 1 ${K.g[0]} (in ${K.g[1]}) liegen, damit beide gewinnen?`,`zwischen ${q(K.lo)} und ${q(K.hi)}`,[`zwischen ${q(1/K.hi)} und ${q(1/K.lo)}`,`über ${q(K.hi)}`,`unter ${q(K.lo)}`],`Zwischen den Opportunitätskosten von ${K.g[0]}: ${q(K.lo)} und ${q(K.hi)} ${K.g[1]}.`,K.fig); },
    gain:R=>{ const K=kc(R), p=(K.lo+K.hi)/2, s=K.cX, k=pickV(R,[2,4,6,8]); const got=k*p, own=k*K.lo;
      return mcN(R,`${K.intro} ${K.nm[s]} spezialisiert sich auf ${K.g[0]} und tauscht ${k} ${K.g[0]} zum Preis 1 ${K.g[0]} = ${q(p)} ${K.g[1]}. Wie viel ${K.g[1]} gewinnt ${K.nm[s]} gegenüber Eigenproduktion?`,got-own,[got,own,k*(K.hi-p)*2],`Durch Tausch: ${k} · ${q(p)} = ${q(got)} ${K.g[1]}. Selbst hätte ${K.nm[s]} für ${k} ${K.g[0]} nur ${k} · ${q(K.lo)} = ${q(own)} ${K.g[1]} herstellen können. Gewinn ${q(got-own)}.`,K.fig); },
    who:R=>{ const K=kc(R), p=pickV(R,[K.hi+1,K.lo/2]), los=p>K.hi?K.nm[K.cY]:K.nm[K.cX];
      return mcT(R,`${K.intro} Der Preis für 1 ${K.g[0]} liegt bei ${q(p)} ${K.g[1]}. Was passiert?`,`${los} würde schlechter gestellt und handelt nicht.`,[`Beide gewinnen.`,`${los===K.nm[0]?K.nm[1]:K.nm[0]} würde schlechter gestellt und handelt nicht.`,`Beide verlieren immer.`],`Erlaubt ist nur ein Preis zwischen ${q(K.lo)} und ${q(K.hi)}. ${p>K.hi?`Bei ${q(p)} wäre ${K.g[0]} für den Käufer teurer als die eigene Produktion.`:`Bei ${q(p)} bekäme der Verkäufer weniger, als ihn ${K.g[0]} selbst kostet.`}`,K.fig); }
  };
  const tT={
    max:R=>{ const K=tc(R), P=K.per; return {t:'calc',text:K.intro,fields:[[`${K.nm[0]}: max. ${K.g[0]}`,K.xA],[`${K.nm[0]}: max. ${K.g[1]}`,K.yA],[`${K.nm[1]}: max. ${K.g[0]}`,K.xB],[`${K.nm[1]}: max. ${K.g[1]}`,K.yB]],ex:`Arbeiter mal Produktivität: ${P.WA} · ${q(P.a)} = ${q(K.xA)}, ${P.WA} · ${q(P.b)} = ${q(K.yA)}, ${P.WB} · ${q(P.c)} = ${q(K.xB)}, ${P.WB} · ${q(P.d)} = ${q(K.yB)}.`,fig:K.fig}; },
    ok:R=>{ const K=tc(R), P=K.per, r=x=>Math.round(x*100)/100; return {t:'calc',text:`${K.intro} Berechne die Opportunitätskosten (auf zwei Nachkommastellen).`,fields:[[`${K.nm[0]}: OK 1 ${K.g[0]} (in ${K.g[1]})`,r(K.okXA)],[`${K.nm[0]}: OK 1 ${K.g[1]} (in ${K.g[0]})`,r(K.okYA)],[`${K.nm[1]}: OK 1 ${K.g[0]} (in ${K.g[1]})`,r(K.okXB)],[`${K.nm[1]}: OK 1 ${K.g[1]} (in ${K.g[0]})`,r(K.okYB)]],ex:`${K.nm[0]}: ${q(P.b)}/${q(P.a)} = ${q(K.okXA)} und Kehrwert ${q(K.okYA)}. ${K.nm[1]}: ${q(P.d)}/${q(P.c)} = ${q(K.okXB)} und ${q(K.okYB)}.`,fig:K.fig}; },
    adv:R=>{ const K=tc(R); return {t:'sort',text:`${K.intro} Wer hat welchen Vorteil?`,items:[[`Absoluter Vorteil bei ${K.g[0]}`,K.aX,K.nm],[`Absoluter Vorteil bei ${K.g[1]}`,K.aY,K.nm],[`Komparativer Vorteil bei ${K.g[0]}`,K.cX,K.nm],[`Komparativer Vorteil bei ${K.g[1]}`,K.cY,K.nm]],ex:`Absolut (mehr pro Arbeiter): ${K.g[0]} ${K.nm[K.aX]}, ${K.g[1]} ${K.nm[K.aY]}. Komparativ (geringere OK): ${K.g[0]} ${K.nm[K.cX]} (${q(Math.min(K.okXA,K.okXB))} statt ${q(Math.max(K.okXA,K.okXB))}), ${K.g[1]} ${K.nm[K.cY]}.`,fig:K.fig}; },
    intv:R=>{ const K=tc(R), r=x=>Math.round(x*100)/100; return {t:'calc',text:`${K.intro} Intervall für den Preis von 1 ${K.g[0]} (in ${K.g[1]}).`,fields:[['Untergrenze',r(K.lo)],['Obergrenze',r(K.hi)]],ex:`Zwischen den Opportunitätskosten von ${K.g[0]}: ${q(K.lo)} (${K.nm[K.cX]}) und ${q(K.hi)} (${K.nm[K.cY]}).`,fig:K.fig}; },
    gain:R=>{ const K=tc(R), r=x=>Math.round(x*100)/100, p=r(K.lo+(K.hi-K.lo)*pickV(R,[0.3,0.5,0.7])), s=K.cX, k=pickV(R,[10,20,25,40,50]);
      const got=k*p, own=k*K.lo, buy=k*K.hi;
      return {t:'calc',text:`${K.intro} ${K.nm[s]} spezialisiert sich auf ${K.g[0]} und verkauft ${k} ${K.g[0]} zum Preis 1 ${K.g[0]} = ${q(p)} ${K.g[1]} an ${K.nm[1-s]}.`,
        fields:[[`${K.g[1]}, die ${K.nm[s]} erhält`,r(got)],[`Handelsgewinn von ${K.nm[s]} (in ${K.g[1]})`,r(got-own)],[`Ersparnis von ${K.nm[1-s]} (in ${K.g[1]})`,r(buy-got)]],
        ex:`${k} · ${q(p)} = ${q(got)}. ${K.nm[s]} hätte selbst ${k} · ${q(K.lo)} = ${q(own)} herstellen können: Gewinn ${q(got-own)}. ${K.nm[1-s]} hätte für ${k} ${K.g[0]} selbst ${k} · ${q(K.hi)} = ${q(buy)} ${K.g[1]} aufgeben müssen: Ersparnis ${q(buy-got)}.`,fig:K.fig}; },
    neu:R=>{ const K=tc(R), P=K.per, f=pickV(R,[2,3,4]); const d2=P.d*f, okB2=d2/P.c, r=x=>Math.round(x*100)/100;
      return {t:'calc',text:`${K.intro} Eine Erfindung ${({2:'verdoppelt',3:'verdreifacht',4:'vervierfacht'})[f]} die Produktivität von ${K.nm[1]} bei ${K.g[1]}.`,fields:[[`${K.nm[1]}: neue max. ${K.g[1]}`,r(P.WB*d2)],[`${K.nm[1]}: neue OK 1 ${K.g[0]} (in ${K.g[1]})`,r(okB2)]],
        ex:`${P.WB} · ${q(d2)} = ${q(P.WB*d2)}. Neue OK: ${q(d2)}/${q(P.c)} = ${q(okB2)}. Vergleiche mit ${K.nm[0]} (${q(K.okXA)}): ${Math.abs(okB2-K.okXA)<0.005?'gleich, keine Handelsgewinne mehr':okB2<K.okXA?`jetzt hat ${K.nm[1]} den komparativen Vorteil bei ${K.g[0]}`:`jetzt hat ${K.nm[0]} den komparativen Vorteil bei ${K.g[0]}`}.`,fig:K.fig}; }
  };
  const tag=(m,f)=>R=>{ const t=f(R); t.m=m; return t; };
  const pick=(R,arr,n)=>{ let o=[]; while(o.length<n) o=o.concat(shufV(R,arr)); return o.slice(0,n); };
  const r2=x=>Math.round(x*100)/100, MIN=[25,35,40,45,50,55,65,70,75,80,90,95];

}
function navHtml(){const r=RES[cur.l];return `<div class="qnav">${r.map((x,i)=>`<button data-go="${i}" class="${i===cur.i?'cur':''} ${x===true?'ok':x===false?'no':''}" aria-label="Aufgabe ${i+1}">${i+1}</button>`).join('')}</div>`;}
// ================= Bepunktung und Notenprojektion =================
// Maßstäbe nach gängigen Uni-Notenschlüsseln: üblich linear ab 50 % (4,0), 5-%-Stufen; streng ab 60 %, 4-%-Stufen.
const NSCH={'50':{n:'üblich (bestanden ab 50 %)',g:[[95,1.0],[90,1.3],[85,1.7],[80,2.0],[75,2.3],[70,2.7],[65,3.0],[60,3.3],[55,3.7],[50,4.0]]},
            '60':{n:'streng (bestanden ab 60 %)',g:[[96,1.0],[92,1.3],[88,1.7],[84,2.0],[80,2.3],[76,2.7],[72,3.0],[68,3.3],[64,3.7],[60,4.0]]}};
let PKT={on:false,sc:'50',fb:'sofort',pts:{}}; try{ const s=JSON.parse(localStorage.getItem('vwllab-pkt')||'null'); if(s) PKT=Object.assign(PKT,s); }catch(e){}
const pktSave=()=>{ try{localStorage.setItem('vwllab-pkt',JSON.stringify(PKT));}catch(e){} };
function noteOf(p,sc){ for(const [g,n] of NSCH[sc||PKT.sc].g) if(p>=g-1e-9) return n; return 5.0; }
const noteW=n=>n<=1.5?'sehr gut':n<=2.5?'gut':n<=3.5?'befriedigend':n<=4?'ausreichend':'nicht ausreichend';
const noteF=n=>n.toFixed(1).replace('.',',');
function maxPts(t){ return t.t==='calc'?2*t.fields.length:t.t==='sort'?t.items.length:2; }
const ptsF=x=>fmt(x,Number.isInteger(x)?0:1);
function noteBox(got,max,extra){ const p=max?got/max*100:0, n=noteOf(p); return `<div class="pktbox"><b>${ptsF(got)} von ${ptsF(max)} Punkten (${fmt(Math.floor(p*10)/10,1)} %)</b> → Notenprojektion <b>${noteF(n)}</b> (${noteW(n)})${extra||''}<br><span class="hint">Maßstab: ${NSCH[PKT.sc].n}. Die echte Grenze legt die Prüferin bzw. der Prüfer fest.</span></div>`; }
function noteTable(max){ return `<details class="ntab"><summary>Notenschlüssel für ${ptsF(max)} Punkte</summary><div class="tblwrap"><table class="tbl"><tr><th>Note</th><th>ab Punkten</th><th>ab %</th></tr>${NSCH[PKT.sc].g.map(([g,n])=>`<tr><td>${noteF(n)}</td><td>${ptsF(Math.ceil(max*g/100*2)/2)}</td><td>${g} %</td></tr>`).join('')}<tr><td>5,0</td><td>darunter</td><td>&lt; ${NSCH[PKT.sc].g[9][0]} %</td></tr></table></div></details>`; }
document.addEventListener('click',e=>{ const t=e.target.closest&&e.target.closest('[data-pkt]'); if(!t) return; const v=t.dataset.pkt; if(v==='tog') PKT.on=!PKT.on; else if(v==='redo'){ pktClear(cur.l); } else PKT.fb=v; pktSave(); if(typeof renderTask==='function'){ renderLevels(); renderTask(); } });
function pktClear(l){ Object.keys(PKT.pts).forEach(k=>{ if(k.startsWith(chKey+'|'+l+'|')) delete PKT.pts[k]; }); pktSave(); }
function lvDone(){ const L=LV[cur.l]; return (L.T||[]).length>0 && L.T.every((t,i)=>PKT.pts[chKey+'|'+cur.l+'|'+i]!=null); }
function pktRow(t){ return `<div class="pktrow"><button type="button" class="pkttog" data-pkt="tog" role="switch" aria-checked="${PKT.on}"><span class="pkl">Klausur-Bepunktung</span><span class="sw ${PKT.on?'on':''}"><i></i></span></button>${PKT.on?`<div class="pktsub"><span>Diese Aufgabe: <b>${maxPts(t)} P</b></span><span class="seg mini">${[['sofort','Punkte sofort'],['ende','erst am Ende']].map(a=>`<button type="button" data-pkt="${a[0]}" class="${PKT.fb===a[0]?'on':''}">${a[1]}</button>`).join('')}</span></div>`:''}</div>`; }
function lvSummary(){ const p=lvPts(); return `<div class="pktend"><b>Stufe geschafft – deine Auswertung</b>${noteBox(p.g,p.m)}${noteTable(p.m)}<button type="button" class="btn ghost" data-pkt="redo">Stufe neu bepunkten</button></div>`; }
function pktBtn(){ return `<button type="button" class="pktbtn ${PKT.on?'on':''}" id="pktbtn" title="Bepunktung wie in der Klausur">${PKT.on?'Punkte an':'Punkte'}</button>`; }
function lvPts(){ let g=0,m=0; const L=LV[cur.l]; (L.T||[]).forEach((t,i)=>{ const k=chKey+'|'+cur.l+'|'+i; if(PKT.pts[k]!=null){ g+=PKT.pts[k]; m+=maxPts(t); } }); return {g,m}; }
function scoreTxt(){let ok=0,n=0;RES.forEach(r=>r.forEach(x=>{if(x===true)ok++;n++;})); if(PKT.on){ const p=lvPts(); if(lvDone()) return `Stufe: ${ptsF(p.g)}/${ptsF(p.m)} P · Note ${noteF(noteOf(p.g/p.m*100))}`; if(PKT.fb==='ende') return `Bepunktet: ${(LV[cur.l].T||[]).filter((t,i)=>PKT.pts[chKey+'|'+cur.l+'|'+i]!=null).length} von ${(LV[cur.l].T||[]).length} Aufgaben`; return p.m?`Stufe: ${ptsF(p.g)}/${ptsF(p.m)} P`:'Stufe: 0 P'; } return `gesamt ${ok} von ${n}`;}

function renderTask(){
  animId++; dragCb=null; areaCb=null; minibox.hidden=true;

  if(t.t==='calc') h+=`<div class="step"><h3>Deine Ergebnisse</h3>${t.fields.map((f,k)=>`<div class="field"><label for="f${k}">${f[0]}</label><span class="numin"><button type="button" class="pm" data-for="f${k}" aria-label="Vorzeichen wechseln">±</button><input type="text" id="f${k}" inputmode="decimal" autocomplete="off"></span></div>`).join('')}<p class="hint">Dezimalzahlen mit Komma oder Punkt, Prozente ohne %-Zeichen. Negativ: Taste ± vor dem Feld. Rundung auf zwei Nachkommastellen reicht.</p></div>`;
  if(t.t==='sort') h+=`<div class="step">${t.items.map((it,k)=>`<div class="srow"><div class="sl">${it[0]}</div><div class="seg" data-r="${k}">${cats(it).map((c,j)=>`<button data-v="${j}">${c}</button>`).join('')}</div></div>`).join('')}</div>`;
  if(t.t==='point') h+=`<div class="step"><h3>Preis einstellen</h3><input type="range" id="ps" min="0" max="${(t.a/t.b).toFixed(2)}" step="${t.step}" value="${t.P0}" aria-label="Preis"><div class="readout" id="ro"></div><p class="hint">Du kannst auch direkt im Diagramm nach oben oder unten ziehen.</p></div>`;
  if(t.t==='pick') h+=`<div class="step"><h3>${t.lab||(t.axis==='Q'?'Menge einstellen':'Preis einstellen')}</h3><input type="range" id="ps" min="${t.min}" max="${t.max}" step="${t.step}" value="${t.v0}" aria-label="${t.lab||(t.axis==='Q'?'Menge':'Preis')}"><div class="readout" id="ro"></div>${t.axis==='T'?'':`<p class="hint">Du kannst auch direkt im Diagramm ${t.axis==='Q'?'nach links oder rechts':'nach oben oder unten'} ziehen.</p>`}</div>`;
  if(t.t==='area') h+=`<div class="step"><h3>Flächen auswählen</h3><div class="seg aseg" id="aseg">${t.opts.map(o=>`<button data-a="${o}">${o}</button>`).join('')}</div><p class="hint">Tippe die Flächen direkt im Diagramm an oder nutze die Knöpfe. ${t.c.length>1?'Es können mehrere Flächen richtig sein.':'Gesucht ist genau eine Fläche.'}</p></div>`;
  if(t.t==='shape') h+=`<div class="step"><h3>${t.kind==='S'?'Angebotselastizität ε<sub>S</sub>':'Betrag der Nachfrageelastizität |ε|'}</h3><input type="range" id="es" min="0" max="${EL.length-1}" step="1" value="3" aria-label="Elastizität"><div class="readout" id="ro"></div></div>`;
  h+=`<div class="actions"><button class="btn" id="chk">Prüfen</button><button class="btn ghost" id="prev" ${cur.i===0&&cur.l===0?'disabled':''}>Zurück</button><button class="btn ghost" id="next">${cur.i===L.T.length-1?(cur.l===LV.length-1?'Von vorn':'Nächste Stufe'):'Weiter'}</button>${L.gen?'<button class="btn ghost" id="newn">Neue Zahlen</button>':''}</div><div id="fb"></div>`;
  panel.innerHTML=h;
  const nb=document.getElementById('newn'); if(nb) nb.onclick=()=>(pktClear(cur.l),chKey==='k11'?newNumbers11(cur.l):chKey==='k17'?newNumbers17(cur.l):newNumbersV(cur.l));
  const fig=t.fig||L.fig; if(t.t!=='point'&&t.t!=='shape'&&t.t!=='pick'&&t.t!=='area') drawScene(fig(0));

  // MC
  let sel=null; panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(checked)return;sel=+b.dataset.o;panel.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));});
  // Zuordnen
  const ssel=t.items?t.items.map(()=>null):null;
  panel.querySelectorAll('.seg[data-r] button').forEach(b=>b.onclick=()=>{if(checked)return;const r=+b.parentElement.dataset.r;ssel[r]=+b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  // Diagrammpunkt
  let P=t.P0; const ro=document.getElementById('ro');
  const pScene=()=>dScene({a:t.a,b:t.b,Pmax:t.Pmax,Qmax:t.Qmax,P,rect:t.rev,zones:checked,hit:!checked,dl:`Q = ${t.a} − ${t.b}P`});
  const pRead=()=>{const Q=t.a-t.b*P, e=Q>0?-t.b*P/Q:-Infinity;
    ro.innerHTML=`<span class="k">Preis P</span><span>${eur(P)}</span><span class="k">Menge Q</span><span>${fmt(Q)}</span>`+(t.rev?`<span class="k">Ausgaben P · Q</span><span>${eur(P*Q)}</span>`:'')+`<span class="k">Elastizität ε</span><span>${checked?f2(e)+' '+clsChip(e):'wird nach dem Prüfen gezeigt'}</span>`;};
  if(t.t==='point'){ const ps=document.getElementById('ps');
    const setP=v=>{P=Math.round(Math.max(0,Math.min(t.a/t.b,v))/t.step)*t.step;P=+P.toFixed(4);ps.value=P;drawScene(pScene());pRead();};
    ps.oninput=()=>{if(!checked)setP(+ps.value);else ps.value=P;}; dragCb=v=>{if(!checked)setP(v);}; setP(P); }
  // Wert im Diagramm wählen (Kapitel 5)
  let V=t.v0;
  if(t.t==='pick'){ const ps=document.getElementById('ps');
    const setV=v=>{V=Math.round(Math.max(t.min,Math.min(t.max,v))/t.step)*t.step;V=+V.toFixed(4);ps.value=V;drawScene(t.scene(V,checked));ro.innerHTML=t.read(V,checked);};
    ps.oninput=()=>{if(!checked)setV(+ps.value);else ps.value=V;}; dragCb=v=>{if(!checked)setV(v);}; setV(V); }
  // Flächen wählen (Kapitel 7)
  const asel=new Set();
  if(t.t==='area'){ const draw=()=>{drawScene(t.scene(asel,checked,t.c)); panel.querySelectorAll('#aseg button').forEach(b=>b.classList.toggle('on',!checked&&asel.has(b.dataset.a)));};
    const tog=a=>{if(checked)return; asel.has(a)?asel.delete(a):asel.add(a); draw();};
    panel.querySelectorAll('#aseg button').forEach(b=>b.onclick=()=>tog(b.dataset.a)); areaCb=tog; draw(); }
  // Kurve formen
  let ei=3; const shRead=()=>{const e=EL[ei], Q1=ceQ1(t.kind,e);
    ro.innerHTML=`<span class="k">Einstellung</span><span>${t.kind==='S'?'ε = ':'|ε| = '}${fmt(e)} ${clsChip(e)}</span><span class="k">Menge bei 4 €</span><span>100</span><span class="k">Menge bei 5 €</span><span>${fmt(Q1,1)}</span><span class="k">Mengenänderung</span><span>${isFinite(Q1)?(Q1>=100?'+':'')+fmt((Q1/100-1)*100,1)+' %':'∞'}</span>`+(t.kind==='D'?`<span class="k">Ausgaben 4 € → 5 €</span><span>400 € → ${eur(5*Q1,0)}</span>`:'');};
  if(t.t==='shape'){ const es=document.getElementById('es'); const upd=()=>{drawScene(ceScene(t.kind,EL[ei]));shRead();}; es.oninput=()=>{if(checked){es.value=ei;return;}ei=+es.value;upd();}; upd(); }

  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cur.i=+b.dataset.go;save();renderTask();});
  document.getElementById('prev').onclick=()=>{if(cur.i>0)cur.i--;else if(cur.l>0){cur.l--;cur.i=LV[cur.l].T.length-1;}save();renderLevels();renderTask();};
  document.getElementById('next').onclick=()=>{if(cur.i<L.T.length-1)cur.i++;else{cur.l=(cur.l+1)%LV.length;cur.i=0;}save();renderLevels();renderTask();};

  const fb=document.getElementById('fb');

    if(t.t==='calc'){ const vals=t.fields.map((f,k)=>document.getElementById('f'+k).value);
      if(vals.some(v=>v.trim()==='')){fb.innerHTML='<div class="fb no"><strong>Noch nicht vollständig</strong>Fülle alle Felder aus.</div>';return;}
      ok=true; const wrong=[];
      t.fields.forEach((f,k)=>{const el=document.getElementById('f'+k), v=num(vals[k]), tol=f[2]||Math.max(0.011,Math.abs(f[1])*0.006), r=Math.abs(v-f[1])<=tol;
        el.classList.toggle('right',r);el.classList.toggle('wrong',!r);el.readOnly=true; if(!r){ok=false;wrong.push(`${f[0]}: richtig wäre <b>${fmt(f[1])}</b>`);} });

      ok=true; panel.querySelectorAll('.seg[data-r]').forEach(sg=>{const r=+sg.dataset.r,c=t.items[r][1];
        sg.querySelectorAll('button').forEach((b,j)=>{b.classList.remove('on');if(j===c)b.classList.add('right');else if(j===ssel[r])b.classList.add('wrong');}); if(ssel[r]!==c) ok=false;}); }
    if(t.t==='point'){ ok=Math.abs(P-t.target)<=0.051; checked=true; if(!ok){P=t.target;document.getElementById('ps').value=P;} drawScene(pScene()); pRead();
      if(!ok) det=`<p style="margin:4px 0">Richtig wäre P = ${eur(t.target)}. Der Punkt steht jetzt dort.</p>`; }

    if(t.t==='area'){ if(!asel.size){fb.innerHTML='<div class="fb no"><strong>Wähle zuerst mindestens eine Fläche.</strong></div>';return;}

      panel.querySelectorAll('#aseg button').forEach(b=>{const a=b.dataset.a;b.classList.remove('on');if(t.c.includes(a))b.classList.add('right');else if(asel.has(a))b.classList.add('wrong');});
      if(!ok) det=`<p style="margin:4px 0">Richtig ${t.c.length>1?'sind die Flächen':'ist die Fläche'} <b>${t.c.join(' + ')}</b>.</p>`; }
    if(t.t==='pick'){ ok=Math.abs(V-t.target)<=t.tol; checked=true; if(!ok){V=t.target;document.getElementById('ps').value=V;} drawScene(t.scene(V,true)); ro.innerHTML=t.read(V,true);
      if(!ok) det=`<p style="margin:4px 0">Richtig wäre ${t.tl}. Das Diagramm zeigt jetzt diesen Wert.</p>`; }
    checked=true;
    let gp=ok?maxPts(t):0;

    if(t.t==='sort') gp=t.items.filter((it,r)=>ssel[r]===it[1]).length;
    const pk=chKey+'|'+cur.l+'|'+cur.i; if(PKT.pts[pk]==null){ PKT.pts[pk]=gp; pktSave(); }
    if(RES[cur.l][cur.i]===null){RES[cur.l][cur.i]=ok;save();}
    if(t.fig&&t.t!=='point'&&t.t!=='shape'&&t.t!=='pick'&&t.t!=='area') animate(t.fig,t.fig===G.mkt?1700:900);
    fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Richtig.':'Nicht ganz.'}${PKT.on&&PKT.fb==='sofort'?` <span class="pktchip">${ptsF(gp)} von ${maxPts(t)} P${PKT.pts[pk]!==gp?' · gewertet: erster Versuch '+ptsF(PKT.pts[pk])+' P':''}</span>`:''}</strong>${det}${t.ex}</div>${PKT.on&&lvDone()?lvSummary():''}`;
    document.getElementById('chk').disabled=true;
    panel.querySelector('.qnav').outerHTML=navHtml();
    panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cur.i=+b.dataset.go;save();renderTask();});

    renderLevels();
  };
}

// ================= Freies Labor =================
const lab={m:'A',a:120,b:20,P:4,B:false,PB:4.5,eD:5,eS:5,sD:0,sS:0,pre:null};
const E2=[0,0.1,0.25,0.5,0.75,1,1.5,2,3,5,Infinity];
const mini=document.getElementById('mini');
function drawMini(){
  const {a,b,P}=lab, Qmax=200, mt=14, mb=24, H2=170-mt-mb, Rm=a*a/(4*b), Rmax=Rm*1.18;
  const X=q=>ML+q/Qmax*W, Y=r=>mt+H2-r/Rmax*H2, R=q=>q*(a-q)/b;
  let s=`<line x1="${ML}" y1="${mt+H2}" x2="${ML+W}" y2="${mt+H2}" stroke="var(--ink)" stroke-width="1.2"/><line x1="${ML}" y1="${mt+H2}" x2="${ML}" y2="${mt-4}" stroke="var(--ink)" stroke-width="1.2"/>`;

    document.getElementById('lro').innerHTML=r;

  upd();
}

  const go=i=>{ keep(); EX.i=Math.max(0,Math.min(EX.Q.length-1,i)); renderExQ(); };
  panel.querySelectorAll('.qnav [data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.getElementById('xp').onclick=()=>go(EX.i-1);
  document.getElementById('xn2').onclick=()=>go(EX.i+1);
  document.getElementById('xend').onclick=()=>{ keep(); const open=EX.A.filter(x=>x==null).length; if(open&&!document.getElementById('xconf')){ document.querySelector('.actions').insertAdjacentHTML('afterend',`<p class="hint" id="xconf">Noch ${open} Aufgabe(n) unbeantwortet. Zum Abgeben nochmal auf „Abgeben“ tippen.</p>`); return; } finishExam(); };
  const tick=()=>{ const el=document.getElementById('xtime'); if(!el) return; const l=exLeft(); if(l==null){ el.textContent='Zeit: '+mmss(Date.now()-EX.t0); return; } el.textContent='Restzeit '+mmss(l); el.classList.toggle('warn',l<60000); if(l<=0){ keep(); finishExam(); } };
  clearInterval(exTimer); exTimer=setInterval(tick,1000); tick();
}
function scoreQ(q,a){ const t=q.t;
  if(a==null) return 0;
  if(t.t==='mc') return a===t.c?1:0;
  if(t.t==='calc'){ let ok=0; t.fields.forEach((f,k)=>{ const v=num(a[k]||''), tol=f[2]||Math.max(0.011,Math.abs(f[1])*0.006); if(Math.abs(v-f[1])<=tol) ok++; }); return ok/t.fields.length; }
  if(t.t==='sort'){ let ok=0; t.items.forEach((it,k)=>{ if(a[k]===it[1]) ok++; }); return ok/t.items.length; }
  return 0; }
function finishExam(){ clearInterval(exTimer); EX.done=true; EX.sc=EX.Q.map((q,i)=>scoreQ(q,EX.A[i])); EX.t1=Date.now();
  EX.pk=PKT.on?PKT.sc:null; EX.mx=EX.Q.map(q=>maxPts(q.t)); EX.gp=EX.Q.map((q,i)=>{ const t=q.t,a=EX.A[i]; if(a==null) return 0; if(t.t==='calc'){ let c=0; t.fields.forEach((f,k)=>{ const v=num(a[k]||''), tol=f[2]||Math.max(0.011,Math.abs(f[1])*0.006); if(Math.abs(v-f[1])<=tol) c++; }); return 2*c; } if(t.t==='sort') return t.items.filter((it,k)=>a[k]===it[1]).length; return EX.sc[i]*EX.mx[i]; });
  const pp=EX.gp.reduce((s,x)=>s+x,0)/EX.mx.reduce((s,x)=>s+x,0)*100;
  const p=EX.pk?pp:EX.sc.reduce((s,x)=>s+x,0)/EX.Q.length*100, d=new Date();
  XS.hist=(XS.hist||[]).concat([{d:d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),a:({mix:'Gemischt',v:'Verständnis',k:'Kopfrechnen',t:'Taschenrechner'})[XS.art],n:EX.Q.length,p,note:EX.pk?noteOf(pp,EX.pk):null}]).slice(-30); xsave(); renderExRes(); }
function ansTxt(q,a){ const t=q.t; if(a==null) return '<i>keine Antwort</i>';
  if(t.t==='mc') return t.opts[a]; if(t.t==='calc') return t.fields.map((f,k)=>`${f[0]}: ${a[k]||'–'}`).join('<br>');
  if(t.t==='sort') return t.items.map((it,k)=>`${it[0]}: ${a[k]!=null?(it[2]||t.cats)[a[k]]:'–'}`).join('<br>'); }
function solTxt(q){ const t=q.t; if(t.t==='mc') return t.opts[t.c]; if(t.t==='calc') return t.fields.map(f=>`${f[0]}: ${fmt(f[1])}`).join('<br>'); if(t.t==='sort') return t.items.map(it=>`${it[0]}: ${(it[2]||t.cats)[it[1]]}`).join('<br>'); }
function renderExRes(){
  const S=EX.sc.reduce((s,x)=>s+x,0), n=EX.Q.length, p=S/n*100;
  const by={}; EX.Q.forEach((q,i)=>{ const b=by[q.ch]||(by[q.ch]={s:0,n:0}); b.s+=EX.sc[i]; b.n++; });
  const grade=p>=87.5?'sehr gut':p>=75?'gut':p>=62.5?'befriedigend':p>=50?'bestanden':'noch nicht bestanden';
  drawScene(EX.Q[0].fig(1));
  const GP=EX.gp?EX.gp.reduce((s,x)=>s+x,0):0, MX=EX.mx?EX.mx.reduce((s,x)=>s+x,0):0;
  if(EX.pk){ const keep=PKT.sc; PKT.sc=EX.pk; var pkHtml=noteBox(GP,MX,` · Dauer ${mmss(EX.t1-EX.t0)}`)+noteTable(MX); PKT.sc=keep; }
  let h=EX.pk?`<div class="lab"><h2>Ergebnis: ${ptsF(GP)} von ${ptsF(MX)} Punkten</h2>${pkHtml}`:`<div class="lab"><h2>Ergebnis: ${fmt(S,1)} von ${n} Punkten (${fmt(p,0)} %)</h2><p>Grobe Einordnung: <b>${grade}</b> (Orientierung ab 50 % bestanden). Dauer: ${mmss(EX.t1-EX.t0)}. Tipp: Mit „Bepunktung“ in der Testauswahl bekommst du eine Notenprojektion.</p>`;
  h+=`
   <div class="tblwrap"><table class="tbl"><tr><th>Kapitel</th><th>Punkte</th><th>Quote</th></tr>${Object.keys(by).map(k=>{ let g=by[k].s,m=by[k].n; if(EX.pk){ g=0;m=0; EX.Q.forEach((q,i)=>{ if(q.ch===k){ g+=EX.gp[i]; m+=EX.mx[i]; } }); } return `<tr><td>${CHN[k]}</td><td>${fmt(g,1)}/${m}</td><td>${fmt(g/m*100,0)} %</td></tr>`; }).join('')}</table></div>
   <div class="actions"><button class="btn" id="xwrong" ${EX.sc.every(x=>x===1)?'disabled':''}>Falsche Aufgaben wiederholen</button><button class="btn ghost" id="xnew">Neuer Test</button></div>
   <div class="xh">Alle Aufgaben</div>`;
  h+=EX.Q.map((q,i)=>`<details class="xrev ${EX.sc[i]===1?'r':EX.sc[i]>0?'h':'w'}"><summary><b>${i+1}.</b> ${EX.pk?ptsF(EX.gp[i])+'/'+EX.mx[i]+' P · ':''}${EX.sc[i]===1?'richtig':EX.sc[i]>0?'teilweise ('+fmt(EX.sc[i]*100,0)+' %)':'falsch'} · ${CH[q.ch].tag} · ${q.lv}</summary>
     <div class="qtext">${q.t.text}</div><p><b>Deine Antwort:</b><br>${ansTxt(q,EX.A[i])}</p><p><b>Richtig:</b><br>${solTxt(q)}</p><div class="note">${q.t.ex||''}</div><button class="btn ghost xfig" data-i="${i}">Diagramm anzeigen</button></details>`).join('');
  h+='</div>'; panel.innerHTML=h;
  panel.querySelectorAll('.xfig').forEach(b=>b.onclick=()=>{ try{drawScene(EX.Q[+b.dataset.i].fig(1));}catch(e){} window.scrollTo({top:0,behavior:'smooth'}); });
  document.getElementById('xnew').onclick=()=>{ EX=null; renderExam(); };
  document.getElementById('xwrong').onclick=()=>{ const Q=EX.Q.filter((_,i)=>EX.sc[i]<1); EX={Q,A:Q.map(()=>null),i:0,t0:Date.now(),lim:0,done:false}; renderExQ(); };
}
