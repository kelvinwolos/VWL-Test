<script>

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.pm'); if(!b) return; e.preventDefault(); const i=document.getElementById(b.dataset.for); if(!i||i.disabled||i.readOnly) return; const v=i.value.trim(); i.value=/^[-−–]/.test(v)?v.replace(/^[-−–]\s*/,''):'-'+v; i.dispatchEvent(new Event('input',{bubbles:true}));});

// ================= Diagramm-Engine =================

function curveCol(c){return c.col||(c.kind==='S'?'var(--sup)':'var(--dem)');}

}
function drawScene(S){
  SC=S; let s='<defs><clipPath id="cp"><rect x="'+ML+'" y="'+MT+'" width="'+W+'" height="'+H+'"/></clipPath><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>';

  s+=`<text x="${ML+W}" y="${VH-10}" font-size="12.5" text-anchor="end" fill="var(--ink)" font-weight="600">${S.x||'Menge'}</text>`;
  s+=`<text transform="translate(16 ${MT+H/2}) rotate(-90)" font-size="12.5" text-anchor="middle" fill="var(--ink)" font-weight="600">${S.y||'Preis (€)'}</text>`;

    if(p.label&&Math.abs(A)>(p.id?260:900)) s+=`<text x="${cx.toFixed(1)}" y="${(cy+5).toFixed(1)}" text-anchor="middle" font-size="${p.id?15:12}" font-weight="${p.id?800:700}" fill="var(--ink)" stroke="var(--paper)" stroke-width="3.5" paint-order="stroke" style="pointer-events:none" font-family="Bricolage Grotesque, sans-serif">${p.label}</text>`; });

  (S.lines||[]).forEach(l=>{ s+=`<line x1="${sx(l[0])}" y1="${sy(l[1])}" x2="${sx(l[2])}" y2="${sy(l[3])}" stroke="${l[4]||'var(--muted)'}" stroke-dasharray="4 4" stroke-width="1.3"/>`; });
  (S.points||[]).forEach(p=>{ if(!(p.P>=0&&p.Q>=0&&p.P<=S.Pmax&&p.Q<=S.Qmax)) return;
    if(p.guides){ s+=`<line x1="${ML}" y1="${sy(p.P)}" x2="${sx(p.Q)}" y2="${sy(p.P)}" stroke="${p.col||'var(--ink)'}" stroke-dasharray="3 3" opacity=".6"/><line x1="${sx(p.Q)}" y1="${sy(p.P)}" x2="${sx(p.Q)}" y2="${MT+H}" stroke="${p.col||'var(--ink)'}" stroke-dasharray="3 3" opacity=".6"/>`; }
    s+= p.hollow?`<circle cx="${sx(p.Q)}" cy="${sy(p.P)}" r="5.5" fill="var(--paper)" stroke="${p.col||'var(--muted)'}" stroke-width="2"/>`

      if(!p.noP) s+=tag(px,y,p.ptag||fmt(p.P),'end',p.col||'var(--ink)','var(--paper)'); if(!p.noQ) s+=tag(x,qy,p.qtag||fmt(p.Q),'top',p.col||'var(--ink)','var(--paper)'); }
    if(p.label){ const right=sx(p.Q)<ML+W*0.75; s+=`<text x="${sx(p.Q)+(right?11:-11)}" y="${sy(p.P)+(p.below?22:-10)}" text-anchor="${right?'start':'end'}" font-size="12.5" font-weight="700" fill="${p.col||'var(--ink)'}" stroke="var(--paper)" stroke-width="4" paint-order="stroke">${p.label}</text>`; }
  });

  chart.innerHTML=s; chart.style.touchAction=S.hit?'none':'auto';
  const L=S.legend||[];

const LG={D:['','var(--dem)','Nachfrage (D)'],S:['','var(--sup)','Angebot (S)'],R:['box','var(--rev-soft);outline:1px solid var(--rev)','Ausgaben P · Q'],E:['dot','var(--ink)','Gleichgewicht'],el:['','var(--el)','elastisch |ε| > 1'],un:['','var(--un)','unelastisch |ε| < 1']};
function text(x,y,t,col,anchor){return `<text x="${x}" y="${y}" text-anchor="${anchor||'start'}" font-size="12.5" font-weight="600" fill="${col}" stroke="var(--paper)" stroke-width="4" paint-order="stroke">${t}</text>`;}

// Drag auf der Zeichenfläche
let dragCb=null, dragging=false, areaCb=null;
chart.addEventListener('click',e=>{ const a=e.target&&e.target.dataset&&e.target.dataset.a; if(a&&areaCb) areaCb(a); });
function pToQ(e){const r=chart.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*VW;return Math.max(0,Math.min(SC.Qmax,(x-ML)/W*SC.Qmax));}
const pVal=e=>SC.hitQ?pToQ(e):pToP(e);

const stopDrag=()=>{dragging=false;}; chart.addEventListener('pointerup',stopDrag); chart.addEventListener('pointercancel',stopDrag);

// Animation zwischen Ausgangs- und Endzustand einer Grafik
let animId=0;
function animate(build,dur,done){ const id=++animId; const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; const t0=performance.now();

  requestAnimationFrame(step); }

// ================= Szenen-Bausteine =================
function inter(D,S){ if(!D||!S||D[1]===S[1]) return null; const P=(S[0]-D[0])/(D[1]-S[1]); return {P,Q:D[0]+D[1]*P}; }

function dScene(o){

    S.legend.push(LG.el,LG.un);

// Zwei Märkte-Kurven mit Verschiebung; k interpoliert von vorher (0) zu nachher (1)

const K={MC:(o,q)=>o.b+2*o.c*q, ATC:(o,q)=>o.FC/q+o.b+o.c*q, AVC:(o,q)=>o.b+o.c*q, C:(o,q)=>o.FC+o.b*q+o.c*q*q};
const qOpt=o=>Math.sqrt(o.FC/o.c);
const LIMO={FC:3,b:0.2,c:0.1}, HOSE={FC:144,b:20,c:1}, F2={FC:200,b:10,c:2};
const rd=rows=>rows.map(r=>`<span class="k">${r[0]}</span><span>${r[1]}</span>`).join('');
function firmScene(o){
  const S={Pmax:o.Pmax,Qmax:o.Qmax,x:o.x||'Menge Q',y:o.y||'Kosten und Erlös (€)',curves:[],points:[],rects:[],lines:[],extra:'',legend:[],hit:!!o.hit,hitQ:o.hit==='Q'};
  const mc=q=>K.MC(o,q), atc=q=>K.ATC(o,q), avc=q=>K.AVC(o,q);
  S.curves.push({type:'fq',f:mc,col:'var(--sup)',label:'MC',lq:Math.min(o.Qmax*0.9,(o.Pmax*0.9-o.b)/(2*o.c))});
  const qo=qOpt(o), ao=atc(qo), lqA=atc(o.Qmax*0.97)<o.Pmax*0.93?o.Qmax*0.97:qo*1.6;
  S.curves.push({type:'fq',f:atc,q0:o.Qmax*0.004,col:'var(--dem)',label:'ATC',lq:lqA});
  if(o.avc) S.curves.push({type:'fq',f:avc,col:'var(--un)',dash:1,label:'AVC',lq:o.Qmax*0.97});
  if(o.P!=null) S.curves.push({type:'hor',p:o.P,col:'var(--rev)',w:2.5,label:'P = MR = AR',lq:o.Qmax*0.42});
  if(o.q!=null&&o.q>0&&o.rect&&o.P!=null){ const a=atc(o.q), g=(o.P-a)*o.q; S.rects.push({Q:o.q,P:Math.max(o.P,a),p0:Math.min(o.P,a),kind:g>=0?'gain':'loss',label:(g>=0?'Gewinn ':'Verlust ')+fmt(Math.abs(g))}); }
  if(o.q!=null&&o.P!=null) S.points.push({P:o.P,Q:o.q,guides:1,tags:1});
  if(o.opt) S.points.push({P:ao,Q:qo,hollow:1,col:'var(--dem)',label:'Betriebsoptimum',below:1});
  S.legend.push(['','var(--sup)','Grenzkosten MC'],['','var(--dem)','Durchschnittskosten ATC']);
  if(o.avc) S.legend.push(['','var(--un)','durchschn. variable Kosten AVC']);
  if(o.P!=null) S.legend.push(['','var(--rev)','Preis = Grenzerlös']);
  if(o.rect) S.legend.push(['box','var(--gain-soft);outline:1px solid var(--ok)','Gewinn'],['box','var(--loss-soft);outline:1px solid var(--bad)','Verlust']);
  return S;
}
function costScene(o){
  const S={Pmax:o.Pmax,Qmax:o.Qmax,x:'Menge Q',y:'€',curves:[],points:[],rects:[],lines:[],extra:'',legend:[]};
  S.curves.push({type:'hor',p:o.FC,col:'var(--muted)',w:1.6,dash:1,label:'FC'});
  S.curves.push({type:'fq',f:q=>K.C(o,q),col:'var(--sup)',label:'C(Q)',lq:o.Qmax*0.9});
  for(let q=0;q<=o.Qmax;q++) if(K.C(o,q)<=o.Pmax) S.points.push({Q:q,P:K.C(o,q),small:1,col:'var(--sup)'});
  S.legend.push(['','var(--sup)','Gesamtkosten C(Q)'],['','var(--muted)','Fixkosten FC']);
  if(o.P!=null){ S.curves.push({type:'fq',f:q=>o.P*q,col:'var(--rev)',label:'R(Q)',lq:Math.min(o.Qmax*0.7,o.Pmax*0.85/o.P)}); S.legend.push(['','var(--rev)','Erlös R(Q) = P · Q']); }
  if(o.mark) o.mark.forEach(q=>S.points.push({Q:q,P:K.C(o,q),guides:1,tags:1,label:'R = C'}));
  return S;
}
// Markt kurz- und langfristig (Folien 46 bis 48): st 0 = A, 1 = Nachfrage steigt, 2 = Markteintritt
const M5={D1:[2400,-100],D2:[2800,-100],S1:[-400,100],S2:[-560,140]};
function mkt5(st,k){
  const L=(u,v,t)=>[u[0]+(v[0]-u[0])*t,u[1]+(v[1]-u[1])*t];
  const D=st===0?M5.D1:st===1?L(M5.D1,M5.D2,k):M5.D2, Sp=st<2?M5.S1:L(M5.S1,M5.S2,k);
  const S={Pmax:22,Qmax:2000,x:'Marktmenge',y:'Preis (€)',curves:[],points:[],rects:[],lines:[],extra:'',legend:[LG.D,['','var(--sup)','kurzfristiges Angebot'],['','var(--ink)','langfristiges Angebot (P = min ATC)']]};
  S.curves.push({type:'hor',p:14,col:'var(--ink)',w:1.8,label:'langfristig'});
  if(st>=1) S.curves.push({type:'lin',a:M5.D1[0],b:M5.D1[1],kind:'D',ghost:1,label:'D₁'});
  if(st>=2) S.curves.push({type:'lin',a:M5.S1[0],b:M5.S1[1],kind:'S',ghost:1,label:'S₁'});
  S.curves.push({type:'lin',a:D[0],b:D[1],kind:'D',label:st>=1?'D₂':'D₁'});
  S.curves.push({type:'lin',a:Sp[0],b:Sp[1],kind:'S',label:st>=2?'S₂':'S₁'});
  const A=inter(M5.D1,M5.S1), B=inter(M5.D2,M5.S1), C=inter(M5.D2,M5.S2), E=inter(D,Sp);
  S.points.push({...A,hollow:st>0?1:0,col:st>0?'var(--muted)':null,label:'A'});
  if(st===1&&k>=1) S.points.push({...B,label:'B'});
  if(st===2){ S.points.push({...B,hollow:1,col:'var(--muted)',label:'B'}); if(k>=1) S.points.push({...C,label:'C'}); }
  S.points.push({...E,guides:1,tags:1});
  return S;
}
const mktAnim=k=>k===0?mkt5(0,0):k<0.5?mkt5(1,k*2):mkt5(2,(k-0.5)*2);

const lab5={m:'U',FC:3,b:0.2,c:0.1,P:1.5,man:false,q:4,st:0};
function drawMini5(o,P,q){
  const Qmax=16, mt=14, mb=24, H2=170-mt-mb, pi=Q=>P*Q-K.C(o,Q);
  let lo=0,hi=0; for(let i=0;i<=80;i++){const v=pi(Qmax*i/80); lo=Math.min(lo,v); hi=Math.max(hi,v);} hi=hi*1.15+0.2; lo=lo*1.05-0.2;
  const X=Q=>ML+Q/Qmax*W, Y=v=>mt+H2-(v-lo)/(hi-lo)*H2;
  let s=`<line x1="${ML}" y1="${Y(0)}" x2="${ML+W}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="1.2"/><line x1="${ML}" y1="${mt+H2}" x2="${ML}" y2="${mt-4}" stroke="var(--ink)" stroke-width="1.2"/>`;
  s+=`<text x="${ML-8}" y="${Y(0)+4}" font-size="11" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono, monospace">0</text>`;
  let d=''; for(let i=0;i<=120;i++){const Q=Qmax*i/120; d+=(i?'L':'M')+X(Q).toFixed(1)+' '+Y(pi(Q)).toFixed(1);} s+=`<path d="${d}" fill="none" stroke="var(--ok)" stroke-width="3"/>`;
  const qs=P<o.b?0:(P-o.b)/(2*o.c);
  if(qs>0&&qs<=Qmax){ s+=`<line x1="${X(qs)}" y1="${Y(pi(qs))}" x2="${X(qs)}" y2="${Y(Math.min(0,pi(qs)))}" stroke="var(--muted)" stroke-dasharray="4 4"/>`; s+=text(X(qs)+8,Y(pi(qs))-6,'Maximum bei P = MC','var(--ink)'); }
  if(q<=Qmax){ s+=`<circle cx="${X(q)}" cy="${Y(pi(q))}" r="6.5" fill="var(--rev)" stroke="var(--paper)" stroke-width="2"/>`; }
  mini.innerHTML=s;
}
function renderLab5(){
  animId++; dragCb=null; levelsEl.hidden=true; minibox.hidden=true;
  let h=`<div class="lab"><div class="seg" style="margin-bottom:14px"><button id="mU" class="${lab5.m==='U'?'on':''}">Unternehmen</button><button id="mM" class="${lab5.m==='M'?'on':''}">Markt kurz- &amp; langfristig</button></div>`;
  if(lab5.m==='U'){
    h+=`<h2>Ein Unternehmen im Wettbewerb</h2><p>Kostenfunktion C(Q) = FC + b · Q + c · Q². Der Preis ist vorgegeben. Zieh den Preis im Diagramm oder stell die Regler ein. Unten siehst du den Gewinn für jede Menge.</p>
    <div class="presets" style="margin-bottom:12px">${[['limo','Limonade (Vorlesung)'],['fix','Hohe Fixkosten'],['ein','Preis unter AVC'],['null','Langfristiges GG']].map(p=>`<button class="pre" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>
    <div class="sl2"><div class="top"><span>Fixkosten FC</span><span id="vfc"></span></div><input type="range" id="rfc" min="0" max="12" step="0.5" value="${lab5.FC}" aria-label="Fixkosten"></div>
    <div class="sl2"><div class="top"><span>b (konstanter Teil der Stückkosten)</span><span id="vb5"></span></div><input type="range" id="rb5" min="0" max="1" step="0.05" value="${lab5.b}" aria-label="b"></div>
    <div class="sl2"><div class="top"><span>c (Krümmung)</span><span id="vc5"></span></div><input type="range" id="rc5" min="0.05" max="0.5" step="0.05" value="${lab5.c}" aria-label="c"></div>
    <div class="sl2"><div class="top"><span style="color:var(--rev)">Marktpreis P</span><span id="vp5"></span></div><input type="range" id="rp5" min="0" max="4" step="0.05" value="${lab5.P}" aria-label="Preis"></div>
    <label class="check"><input type="checkbox" id="cman" ${lab5.man?'checked':''}> Menge selbst wählen (statt P = MC)</label>
    <div class="sl2" id="qwrap" ${lab5.man?'':'hidden'}><div class="top"><span>Menge Q</span><span id="vq5"></span></div><input type="range" id="rq5" min="0" max="16" step="0.1" value="${lab5.q}" aria-label="Menge"></div>
    <div class="calcline" id="cl5"></div><div class="readout" id="lro5"></div><div class="note" id="st5"></div>`;
  } else {
    h+=`<h2>Markt kurz- und langfristig</h2><p>Die Folien 46 bis 48 mit Zahlen: Jedes Unternehmen hat C(q) = 50 + 4q + 0,5q², also min ATC = 14. Anfangs gibt es 100 Unternehmen.</p>
    <div class="seg" id="stp">${['A · Ausgangslage','B · Nachfrage steigt','C · Markteintritt'].map((t,i)=>`<button data-s="${i}" class="${lab5.st===i?'on':''}">${t}</button>`).join('')}</div>
    <div class="tblwrap"><table class="tbl" id="tb5"></table></div><div class="note" id="n5"></div>`;
  }
  h+='</div>'; panel.innerHTML=h;
  document.getElementById('mU').onclick=()=>{lab5.m='U';renderLab5();};
  document.getElementById('mM').onclick=()=>{lab5.m='M';renderLab5();};
  if(lab5.m==='U') labU(); else labM();
}
function labU(){
  minibox.hidden=false; document.getElementById('minicap').textContent='Gewinn π(Q) für jede Menge';
  const ids=['rfc','rb5','rc5','rp5','rq5'].map(i=>document.getElementById(i)), cman=document.getElementById('cman');
  const upd=()=>{
    const o={FC:lab5.FC,b:lab5.b,c:lab5.c}, P=lab5.P, qs=P<o.b?0:(P-o.b)/(2*o.c), q=lab5.man?lab5.q:qs;
    ids[0].value=o.FC;ids[1].value=o.b;ids[2].value=o.c;ids[3].value=P;ids[4].value=lab5.q;
    drawScene(firmScene({...o,Pmax:4,Qmax:16,P,q,rect:1,avc:1,opt:o.FC>0,hit:lab5.man?'Q':'P'})); drawMini5(o,P,q);
    const R=P*q, C=K.C(o,q), pi=R-C, qo=o.FC>0?qOpt(o):0, amin=o.FC>0?K.ATC(o,qo):o.b;
    document.getElementById('vfc').textContent=eur(o.FC); document.getElementById('vb5').textContent=fmt(o.b); document.getElementById('vc5').textContent=fmt(o.c); document.getElementById('vp5').textContent=eur(P); document.getElementById('vq5').textContent=fmt(q);
    document.getElementById('cl5').innerHTML=`MC(Q) = ${fmt(o.b)} + ${fmt(2*o.c)}Q = P ⇒ Q* = ${P<o.b?'0 (P < min AVC)':fmt(qs)}`;
    document.getElementById('lro5').innerHTML=rd([['Menge Q',fmt(q)+(lab5.man&&Math.abs(q-qs)>0.05?' (Optimum: '+fmt(qs)+')':'')],['Erlös R = P · Q',eur(R)],['Kosten C(Q)',eur(C)],['Gewinn π',eur(pi)],['ATC(Q)',q>0?eur(K.ATC(o,q)):'–'],['Betriebsminimum (min AVC)',eur(o.b)],['Betriebsoptimum (min ATC)',o.FC>0?eur(amin)+' bei Q = '+fmt(qo):'–']]);
    let st; if(P<o.b) st='<b>Produktion einstellen.</b> Der Preis liegt unter den minimalen durchschnittlichen variablen Kosten. Jede produzierte Einheit erhöht den Verlust, Stillstand kostet nur die Fixkosten.';
    else if(Math.abs(P-amin)<0.01) st='<b>Nullgewinn: langfristiges Gleichgewicht.</b> P = MC = min ATC. Niemand tritt ein oder aus.';
    else if(P<amin) st='<b>Verlust, aber kurzfristig weiter produzieren.</b> P liegt über AVC und deckt einen Teil der Fixkosten. Bleibt der Preis so, tritt das Unternehmen langfristig aus.';
    else st='<b>Gewinn.</b> P liegt über den Durchschnittskosten. Langfristig locken solche Gewinne neue Anbieter an.';
    document.getElementById('st5').innerHTML=st;
  };
  ids[0].oninput=()=>{lab5.FC=+ids[0].value;upd();}; ids[1].oninput=()=>{lab5.b=+ids[1].value;upd();}; ids[2].oninput=()=>{lab5.c=+ids[2].value;upd();};

const dinv=(D,Q)=>(Q-D[0])/D[1], sinv=(S,Q)=>S[1]===0?null:(Q-S[0])/S[1];
const qdem=(D,P)=>D[0]+D[1]*P, qsup=(S,P)=>S[0]+S[1]*P;
function csPts(D,Q,P){return [[0,-D[0]/D[1]],[Q,dinv(D,Q)],[Q,P],[0,P]];}
function psPts(S,Q,P){ if(S[1]===0) return [[0,P],[Q,P],[Q,0],[0,0]];
  const pm=-S[0]/S[1], pts=[[0,P],[Q,P],[Q,sinv(S,Q)]]; if(pm>=0) pts.push([0,pm]); else pts.push([S[0],0],[0,0]); return pts; }
const polyArea=pts=>{let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1];}return Math.abs(a)/2;};

// Preiskontrolle: kind 'ceil' (Höchstpreis) oder 'floor' (Mindestpreis); Zuteilung an die höchste Zahlungsbereitschaft bzw. die niedrigsten Kosten
function ctrl(o){
  const e=inter(o.D,o.S), P1=e.P, Q1=e.Q, P=o.Pbar;
  const bind=P!=null&&(o.kind==='ceil'?P<P1-1e-9:P>P1+1e-9);
  if(!bind){ const cs=csPts(o.D,Q1,P1), ps=psPts(o.S,Q1,P1); return {P1,Q1,bind,QD:Q1,QS:Q1,Qt:Q1,cs,ps,nwl:null,CS:polyArea(cs),PS:polyArea(ps),NWL:0,top:P1,bot:P1}; }
  const QD=Math.max(0,qdem(o.D,P)), QS=Math.max(0,qsup(o.S,P)), Qt=Math.min(QD,QS);
  const top=dinv(o.D,Qt), b0=sinv(o.S,Qt), bot=b0==null?P1:b0;
  const cs=csPts(o.D,Qt,P), ps=psPts(o.S,Qt,P);
  let nwl=null; if(Qt<Q1-1e-9) nwl=o.S[1]===0?[[Qt,top],[Q1,P1],[Q1,0],[Qt,0]]:[[Qt,top],[Q1,P1],[Qt,bot]];
  return {P1,Q1,bind,QD,QS,Qt,cs,ps,nwl,CS:polyArea(cs),PS:polyArea(ps),NWL:nwl?polyArea(nwl):0,top,bot};
}

function taxCalc(D,S,T){
  const e=inter(D,S), b=D[1], d=S[1]; let PD=(S[0]-D[0]-d*T)/(b-d), PS=PD-T, QT=D[0]+b*PD;
  if(QT<0){ QT=0; PD=-D[0]/b; PS=PD-T; }
  const cs=csPts(D,QT,PD), ps=psPts(S,QT,PS);
  return {P1:e.P,Q1:e.Q,PD,PS,QT,rev:T*QT,nwl:Math.abs(T*(e.Q-QT))/2,cs,ps,CS:polyArea(cs),PSr:polyArea(ps),CS0:polyArea(csPts(D,e.Q,e.P)),PS0:polyArea(psPts(S,e.Q,e.P))};
}

 {t:'mc',text:'Mietpreisbremse: Warum ist der Nachfrageüberschuss langfristig größer als kurzfristig?',fig:G7.rent,

  ex:'Der Mindestlohn ist ein Mindestpreis für Arbeit. Liegt er über dem Gleichgewichtslohn, fragen Unternehmen weniger Arbeit nach, während mehr Menschen arbeiten wollen. Die Vorlesung ergänzt: Haben Arbeitgeber Marktmacht (Monopson), kann ein Mindestlohn die Beschäftigung sogar erhöhen. Empirisch zeigen sich eher keine großen negativen Effekte.'},
 {t:'calc',text:'Arbeitsmarkt: Arbeitsnachfrage L<sup>D</sup> = 100 − 4w, Arbeitsangebot L<sup>S</sup> = 6w − 20 (w = Stundenlohn). Ein Mindestlohn von 14 € wird eingeführt.',fig:G7.labor,

function drawMini7(k,Q1,T){

  let d1='',d2=''; for(let i=0;i<=100;i++){const t=Tm*i/100; d1+=(i?'L':'M')+X(t).toFixed(1)+' '+Y(t*(Q1-k*t)).toFixed(1); d2+=(i?'L':'M')+X(t).toFixed(1)+' '+Y(0.5*k*t*t).toFixed(1);}

  s+=`<line x1="${X(Tm/2)}" y1="${Y(Q1*Q1/(4*k))}" x2="${X(Tm/2)}" y2="${mt+H2}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;

  mini.innerHTML=s;
}

  opts:['Ob Stau herrscht.','Wer die Straße gebaut hat.','Ob man für die Straße Steuern zahlt.','Wie lang die Straße ist.'],c:0,
  ex:'Ohne Stau stört dein Auto niemanden: keine Rivalität, also öffentliches Gut. Mit Stau nimmt jedes weitere Auto den anderen Platz weg: Rivalität, also Allmendegut. Ausschließen kann man auf einer öffentlichen Straße in beiden Fällen niemanden.'},
 {t:'sort',text:'Und die Maut-Straße?',
  items:[['Maut-Straße ohne Stau',1,GUT],['Maut-Straße mit Stau',0,GUT],['Öffentliche Straße mit Stau',2,GUT],['Öffentliche Straße ohne Stau',3,GUT]],
  ex:'Die Maut macht die Straße ausschließbar. Ob Club- oder privates Gut, entscheidet wieder der Stau, also die Rivalität.'},
 {t:'mc',text:'Bei welchen Gütern führen Märkte laut Vorlesung zu den besten Ergebnissen?',
  opts:['Bei privaten Gütern mit klar geregelten Eigentumsrechten.','Bei öffentlichen Gütern.','Bei Allmendegütern.','Bei allen Gütern gleichermaßen.'],c:0,
  ex:'Nur bei privaten Gütern funktioniert der Preismechanismus ohne Probleme: Wer nicht zahlt, bekommt nichts, und was einer kauft, fehlt den anderen. Fehlt eine der beiden Eigenschaften, kann der Markt versagen.'}
]},
{n:'Öffentliche Güter',d:'Kap. 8 · Bereitstellung öffentlicher Güter und das Trittbrettfahrerproblem.',fig:G8.mkt,T:[
 {t:'calc',text:'Feuerwerk zur Kieler Woche: 200.000 Einwohner sind im Schnitt bereit, je 3 € dafür zu zahlen. Das Feuerwerk kostet 100.000 €. (Kopfrechnen)',
  fields:[['Gesamte Zahlungsbereitschaft (€)',600000],['Nettonutzen für die Stadt (€)',500000]],
  ex:'200.000 · 3 € = 600.000 €. Abzüglich 100.000 € Kosten bleiben 500.000 €. Weil der Gesamtnutzen die Kosten übersteigt, sollte das Feuerwerk stattfinden.'},
 {t:'mc',text:'Ein privates Unternehmen verkauft Eintrittskarten für das Feuerwerk zu 2 €. Warum kaufen viele trotzdem keine?',
  opts:['Weil man das Feuerwerk auch ohne Karte sehen kann.','Weil 2 € mehr ist, als ihnen das Feuerwerk wert ist.','Weil das Feuerwerk rivalisierend ist.','Weil der Staat den Verkauf verbietet.'],c:0,
  ex:'Das Feuerwerk ist nicht ausschließbar. Jeder kann zuschauen, ohne zu zahlen. Wer das tut, verhält sich als Trittbrettfahrer (free rider). Mit 3 € Zahlungsbereitschaft wäre die Karte für 2 € ihr Geld eigentlich wert.'},
 {t:'calc',text:'Die Stadt erhebt stattdessen eine Kopfsteuer und finanziert damit die 100.000 €. (Kopfrechnen, 200.000 Einwohner, Zahlungsbereitschaft je 3 €)',
  fields:[['Kopfsteuer je Einwohner (€)',0.5],['Durchschnittliche Konsumentenrente je Einwohner (€)',2.5]],
  ex:'100.000 € / 200.000 = 0,50 €. Jeder zahlt 0,50 € und hat einen Nutzen von 3 €, also bleibt eine Konsumentenrente von 2,50 €. So löst der Staat das Trittbrettfahrerproblem.'},
 {t:'mc',text:'Wer ist ein Trittbrettfahrer?',
  opts:['Eine Person, die den Nutzen eines Gutes erhält, ohne dafür zu bezahlen.','Eine Person, die ein Gut kauft und teurer weiterverkauft.','Ein Unternehmen, das die Preise der Konkurrenz kopiert.','Eine Person, die mehr zahlt, als ihr das Gut wert ist.'],c:0,
  ex:'Das ist die Definition aus der Vorlesung. Trittbrettfahren ist nur möglich, wenn man niemanden von der Nutzung ausschließen kann.'},
 {t:'mc',text:'Warum führt das Trittbrettfahrerproblem zu Marktversagen?',
  opts:['Private Anbieter können ihre Kosten nicht decken und bieten das Gut deshalb gar nicht oder zu wenig an.','Private Anbieter verlangen zu hohe Preise.','Es wird zu viel von dem Gut produziert.','Der Staat muss das Gut verbieten.'],c:0,
  ex:'Jeder hofft, dass andere zahlen. Dann reichen die Einnahmen nicht, und das Gut wird nicht bereitgestellt, obwohl der Nutzen die Kosten übersteigt. Das Ergebnis ist eine Unterversorgung mit öffentlichen Gütern.'},
 {t:'mc',text:'Wann sollte der Staat ein öffentliches Gut bereitstellen?',
  opts:['Wenn der Gesamtnutzen die Gesamtkosten übersteigt (Kosten-Nutzen-Analyse).','Immer, wenn Bürger es sich wünschen.','Nur wenn kein Bürger Trittbrettfahrer ist.','Nur wenn ein privates Unternehmen es auch anbieten würde.'],c:0,
  ex:'Der Staat finanziert das Gut über Steuern und kann so die Wohlfahrt erhöhen. Die Entscheidung stützt er auf eine Kosten-Nutzen-Analyse. Schwierig ist dabei, die Zahlungsbereitschaften überhaupt zu ermitteln.'},
 {t:'sort',text:'Welche Beispiele nennt die Vorlesung als wichtige öffentliche Güter?',cats:['öffentliches Gut','kein öffentliches Gut'],
  items:[['Nationale Verteidigung',0],['Grundlagenforschung',0],['Klimaschutz',0],['Armutsbekämpfung',0],['Schokoriegel',1],['Fische im Meer',1]],
  ex:'Verteidigung, Grundlagenforschung, Armutsbekämpfung und Klimaschutz kommen allen zugute, und niemand kann ausgeschlossen werden. Der Schokoriegel ist ein privates Gut, die Fische sind ein Allmendegut. Bei Bildung, Kinderbetreuung und Straßen setzt die Vorlesung ein Fragezeichen: Sie sind teilweise ausschließbar oder rivalisierend.'}
]},
{n:'Externalitäten',d:'Kap. 9 · Was externe Effekte sind und warum sie zu Marktversagen führen.',fig:G8.mkt,T:[
 {t:'mc',text:'Was ist eine Externalität?',
  opts:['Eine unkompensierte Auswirkung ökonomischen Handelns auf die Wohlfahrt unbeteiligter Dritter.','Ein Gut, das aus dem Ausland importiert wird.','Ein Preis, den der Staat von außen festlegt.','Eine Steuer, die Unternehmen an Dritte zahlen.'],c:0,
  ex:'Entscheidend sind zwei Wörter: unbeteiligt und unkompensiert. Ein Dritter, der an dem Geschäft nicht beteiligt ist, wird bevorzugt oder benachteiligt, ohne dass dafür bezahlt wird.'},
 {t:'sort',text:'Positive oder negative Externalität?',cats:['positiv','negativ'],
  items:[['Abgase von Autos',1],['Impfungen',0],['Bellender Hund des Nachbarn',1],['Bildung',0],['Restaurierung historischer Gebäude',0],['Laute Musik im Wohnblock',1],['Erfindungen (technologische Spillover)',0],['Unterhalten während der Vorlesung',1]],
  ex:'Negativ: Dritte tragen Kosten (Lärm, Abgase, Ablenkung). Positiv: Dritte haben einen Nutzen (wer geimpft ist, schützt auch andere; Erfindungen helfen auch anderen Firmen).'},
 {t:'mc',text:'Wie verhält sich die Marktmenge bei einer <b>negativen</b> Externalität zur sozial optimalen Menge?',
  opts:['Der Markt produziert mehr als das soziale Optimum.','Der Markt produziert weniger als das soziale Optimum.','Beide Mengen sind gleich.','Das hängt nur vom Preis ab.'],c:0,
  ex:'Die Produzenten berücksichtigen nur ihre privaten Kosten, nicht die Kosten der Dritten. Für sie wirkt die Produktion billiger, als sie für die Gesellschaft ist, also wird zu viel produziert.'},
 {t:'mc',text:'Und bei einer <b>positiven</b> Externalität?',
  opts:['Der Markt produziert weniger als das soziale Optimum.','Der Markt produziert mehr als das soziale Optimum.','Beide Mengen sind gleich.','Es wird gar nichts produziert.'],c:0,
  ex:'Die Käufer berücksichtigen nur ihren eigenen Nutzen, nicht den Nutzen für andere. Der gesellschaftliche Wert ist höher, als die Nachfrage zeigt, also wird zu wenig gehandelt.'},
 {t:'mc',text:'Wie setzen sich die volkswirtschaftlichen Kosten einer Einheit zusammen?',
  opts:['Private Kosten des Produzenten plus externe Kosten der unbeteiligten Dritten.','Private Kosten minus externe Kosten.','Nur die externen Kosten.','Private Kosten plus Steuer.'],c:0,
  ex:'Volkswirtschaftliche Kosten = private Kosten + externe Kosten. Im Diagramm liegt die Kurve der volkswirtschaftlichen Kosten deshalb um die externen Kosten je Einheit über der Angebotskurve.'},
 {t:'calc',text:'Ein Aluminiumwerk hat private Kosten von 6 € je Tonne. Die Luftverschmutzung verursacht bei Anwohnern Schäden von 2 € je Tonne. (Kopfrechnen)',
  fields:[['Volkswirtschaftliche Kosten je Tonne (€)',8]],
  ex:'6 € + 2 € = 8 €. Die Anwohner tragen 2 € je Tonne, ohne dafür entschädigt zu werden. Das Werk rechnet aber nur mit 6 €.'},
 {t:'calc',text:'Eine Impfung ist einer Person 30 € wert. Weil sie dadurch auch andere schützt, entsteht für die Gesellschaft ein zusätzlicher Nutzen von 20 €. (Kopfrechnen)',
  fields:[['Volkswirtschaftlicher Wert der Impfung (€)',50]],
  ex:'30 € + 20 € = 50 €. Die Person entscheidet aber nur nach ihren 30 €. Wenn die Impfung zum Beispiel 40 € kostet, lässt sie sich nicht impfen, obwohl es sich für die Gesellschaft lohnen würde.'}
]},
{n:'Negativ im Diagramm',d:'Kap. 9 · Aluminiummarkt: privates und soziales Optimum, Wohlfahrtsverlust.',fig:G8.neg,T:[
 {t:'mc',text:'Im Diagramm: Wo liegt das soziale Optimum bei einer negativen Externalität?',fig:G8.neg,
  opts:['Im Schnittpunkt der Nachfrage mit der Kurve der volkswirtschaftlichen Kosten.','Im Schnittpunkt der Nachfrage mit der Angebotskurve.','Im Schnittpunkt von Angebot und volkswirtschaftlichen Kosten.','Bei der Menge null.'],c:0,
  ex:'Der Schnittpunkt von Nachfrage und Angebot ist das Marktgleichgewicht. Das Optimum berücksichtigt alle Kosten, also schneidet die Nachfrage dort die nach oben verschobene Kurve der volkswirtschaftlichen Kosten.'},
 {t:'pick',axis:'Q',lab:'Menge einstellen',text:'Aluminiummarkt: Die externen Kosten betragen 2 € je Tonne. Zieh die Menge auf das soziale Optimum, also dorthin, wo der private Wert genau den volkswirtschaftlichen Kosten entspricht.',
  min:0,max:100,step:1,v0:60,target:30,tol:0.51,tl:'die Menge 30',
  scene:(v,ch)=>extScene({...AL,type:'neg',x:'Aluminiummenge',y:'Aluminiumpreis',Qsel:v,hit:1,hitQ:1,showOpt:ch,nwl:ch,sl:'Volksw. Kosten'}),
  read:extRead({...AL,type:'neg'}),
  ex:'Bei 30 Tonnen zahlen die Käufer gerade noch 7 €, und die volkswirtschaftlichen Kosten sind 5 € + 2 € = 7 €. Das Marktgleichgewicht liegt bei 40: Dort ist der Wert nur 6 €, die volkswirtschaftlichen Kosten aber 8 €.'},
 {t:'calc',text:'Lies aus dem Diagramm ab (Kopfrechnen): Marktgleichgewicht bei 40 Tonnen, soziales Optimum bei 30 Tonnen, externe Kosten 2 € je Tonne.',fig:G8.neg,
  formula:['NWL = ½ · externe Kosten je Einheit · Mengendifferenz'],
  fields:[['Zu viel produzierte Menge',10],['Wohlfahrtsverlust (€)',10]],
  ex:'40 − 30 = 10 Tonnen zu viel. Wohlfahrtsverlust: ½ · 2 · 10 = 10 €. Für jede dieser 10 Tonnen sind die volkswirtschaftlichen Kosten höher als der Wert für die Käufer.'},
 {t:'mc',text:'Alte MC-Aufgabe: Ein Kohlekraftwerk emittiert bei der Stromproduktion Stickstoffdioxide, wodurch es zu Erkrankungen im Umfeld kommt. Welche Aussage ist richtig?',
  opts:['Das soziale Optimum liegt über der Gleichgewichtsmenge.','Das soziale Optimum liegt unterhalb der Gleichgewichtsmenge.','Diese positive Externalität kann durch eine Pigou-Steuer internalisiert werden.','Die volkswirtschaftlichen Kosten liegen unterhalb der privaten Kosten.'],c:1,
  ex:'Das ist eine negative Externalität: Die Anwohner tragen Kosten. Also wird zu viel Strom produziert, das Optimum liegt unter der Gleichgewichtsmenge. C nennt sie fälschlich positiv, D dreht die Kosten um.'},
 {t:'mc',text:'Was bedeutet <b>Internalisierung</b> einer Externalität?',
  opts:['Anreize schaffen, damit die Akteure die externen Effekte bei ihren Entscheidungen berücksichtigen.','Das Unternehmen verlagert die Produktion ins Inland.','Der Staat übernimmt die Produktion.','Die Dritten werden vom Markt ausgeschlossen.'],c:0,
  ex:'Die externen Kosten werden zu „internen“ Kosten des Verursachers gemacht, zum Beispiel über eine Steuer. Dann rechnet er sie selbst mit, und der Markt landet beim Optimum.'},
 {t:'calc',text:'Der Staat erhebt eine Steuer genau in Höhe der externen Kosten: 2 € je Tonne. (Kopfrechnen, Werte aus dem Diagramm nach dem Prüfen)',fig:G8.negT,
  fields:[['Neue Menge',30],['Preis, den die Käufer zahlen (€)',7],['Preis, den die Werke behalten (€)',5],['Steueraufkommen (€)',60]],
  ex:'Mit der Steuer liegt die Angebotskurve genau auf der Kurve der volkswirtschaftlichen Kosten. Der Markt landet beim Optimum: 30 Tonnen zu 7 €, die Werke behalten 5 €. Aufkommen: 2 · 30 = 60 €. Das ist dieselbe Rechnung wie die Steuer aus Kapitel 7, nur ist die Steuer jetzt kein Wohlfahrtsverlust, sondern die Korrektur.'}
]},
{n:'Positiv im Diagramm',d:'Kap. 9 · Bildung als positive Externalität, Subventionen und Patente.',fig:G8.pos,T:[
 {t:'mc',text:'Alte MC-Aufgabe: Eine positive Externalität liegt vor, wenn …',
  opts:['… durch Einführung einer Pigou-Steuer eine sozial optimale Allokation erreicht wird.','… der gesellschaftliche Wert höher ausfällt als der private Nutzen.','… die optimale Outputmenge unterhalb der Gleichgewichtsmenge liegt.','… die volkswirtschaftlichen Kosten höher sind als die privaten Kosten.'],c:1,
  ex:'Bei einer positiven Externalität profitieren Dritte mit. Deshalb ist der gesellschaftliche Wert höher als der private. A, C und D beschreiben jeweils eine negative Externalität.'},
 {t:'mc',text:'Wo liegt bei einer positiven Externalität das soziale Optimum?',fig:G8.pos,
  opts:['Im Schnittpunkt der Kurve des volkswirtschaftlichen Werts mit der Angebotskurve.','Im Schnittpunkt von Nachfrage und Angebot.','Im Schnittpunkt der Nachfrage mit dem volkswirtschaftlichen Wert.','Dort, wo die Nachfrage die Mengenachse schneidet.'],c:0,
  ex:'Jetzt verschiebt sich nicht die Kosten-, sondern die Wertkurve. Der volkswirtschaftliche Wert liegt über der privaten Nachfrage. Wo er das Angebot schneidet, liegt das Optimum, rechts vom Marktgleichgewicht.'},
 {t:'pick',axis:'Q',lab:'Menge einstellen',text:'Markt für Bildung: Der externe Nutzen beträgt 2 € je Einheit. Zieh die Menge auf das soziale Optimum.',
  min:0,max:100,step:1,v0:20,target:50,tol:0.51,tl:'die Menge 50',
  scene:(v,ch)=>extScene({...AL,type:'pos',x:'Menge an Bildung',y:'Preis',Qsel:v,hit:1,hitQ:1,showOpt:ch,nwl:ch,dl:'Volksw. Wert'}),
  read:extRead({...AL,type:'pos'}),
  ex:'Bei 50 Einheiten sind die privaten Kosten 7 €, und der volkswirtschaftliche Wert ist 5 € + 2 € = 7 €. Der Markt allein landet bei 40 und lässt damit 10 Einheiten aus, die der Gesellschaft mehr wert sind, als sie kosten.'},
 {t:'calc',text:'Kopfrechnen: Marktgleichgewicht bei 40, soziales Optimum bei 50, externer Nutzen 2 € je Einheit.',fig:G8.pos,
  fields:[['Zu wenig produzierte Menge',10],['Wohlfahrtsverlust (€)',10]],
  ex:'50 − 40 = 10 Einheiten fehlen. Wohlfahrtsverlust: ½ · 2 · 10 = 10 €. Die Formel ist dieselbe wie bei der negativen Externalität, nur liegt das Dreieck rechts vom Marktgleichgewicht.'},
 {t:'mc',text:'Wie internalisiert der Staat typischerweise eine positive Externalität?',fig:G8.posS,
  opts:['Durch eine Subvention in Höhe des externen Nutzens.','Durch eine Pigou-Steuer.','Durch ein Verbot des Gutes.','Durch einen Höchstpreis.'],c:0,
  ex:'Eine Subvention macht das Gut für Käufer billiger bzw. für Anbieter lukrativer. Ist sie so hoch wie der externe Nutzen (hier 2 €), landet der Markt genau beim Optimum von 50 Einheiten.'},
 {t:'mc',text:'Warum können Patente eine Externalität internalisieren?',
  opts:['Sie geben dem Erfinder für eine gewisse Zeit ein Eigentumsrecht an der Innovation, sodass er einen größeren Teil des Nutzens selbst erhält.','Sie verbieten anderen Firmen die Forschung.','Sie senken die Preise für neue Produkte.','Sie sind eine Steuer auf Erfindungen.'],c:0,
  ex:'Ohne Patent könnten andere die Erfindung kostenlos nutzen (technologischer Spillover). Dann lohnt sich Forschen für den Erfinder weniger, als es der Gesellschaft nützt. Das Patent sichert ihm einen Teil dieses Nutzens.'},
 {t:'sort',text:'Zu viel oder zu wenig? Was macht der Markt ohne Eingriff?',cats:['zu viel','zu wenig'],
  items:[['Stromerzeugung im Kohlekraftwerk',0],['Grundlagenforschung',1],['Impfungen',1],['Autofahren in der Innenstadt',0],['Restaurierung historischer Gebäude',1]],
  ex:'Negative Externalität: Der Markt produziert zu viel. Positive Externalität: Der Markt produziert zu wenig.'}
]},
{n:'Private Lösungen',d:'Kap. 9 · Normen, Verhandlungen, Coase-Theorem und seine Grenzen.',fig:G8.mkt,T:[
 {t:'sort',text:'Welche Lösungen nennt die Vorlesung als private Lösungen, welche als staatliche?',cats:['privat','staatlich'],
  items:[['Moralische Normen und soziale Sanktionen',0],['Stiftungen und Vereine',0],['Verträge zwischen den Betroffenen',0],['Pigou-Steuer',1],['Festlegung von Emissionsniveaus',1],['Handelbare Umweltzertifikate',1]],
  ex:'Der Staat muss nicht immer eingreifen. Bei der WG-Party kannst du dich auch mit den Nachbarn arrangieren, bevor jemand die Polizei ruft.'},
 {t:'mc',text:'Was besagt das Coase-Theorem?',
  opts:['Private Verhandlungen lösen das Problem der Externalitäten, wenn die Eigentumsrechte klar definiert und die Transaktionskosten gering sind.','Externalitäten können nur durch den Staat gelöst werden.','Eine Pigou-Steuer ist immer besser als Verhandlungen.','Der Verursacher muss den Geschädigten immer entschädigen.'],c:0,
  ex:'Wenn klar ist, wem welches Recht gehört, und Verhandeln kaum etwas kostet, finden die Beteiligten selbst die effiziente Lösung. Wer das Recht bekommt, beeinflusst nur, wer an wen zahlt, nicht das Ergebnis.'},
 {t:'mc',text:'Was sind Transaktionskosten?',
  opts:['Kosten, die den Vertragsparteien durch Vertragsabschluss und Vertragserfüllung entstehen.','Die Kosten der Produktion eines Gutes.','Steuern auf Finanztransaktionen.','Die externen Kosten der Verschmutzung.'],c:0,
  ex:'Zum Beispiel Zeit für Verhandlungen, Anwälte, Kontrolle, ob der Vertrag eingehalten wird. Sind sie hoch, scheitert die private Lösung.'},
 {t:'calc',text:'Klassisches Coase-Beispiel: Der Hund von Dick ist ihm 500 € wert. Das Bellen schadet der Nachbarin Jane mit 800 €. Dick hat das Recht, den Hund zu halten. (Kopfrechnen)',
  fields:[['Mindestbetrag, den Jane zahlen muss, damit Dick den Hund abgibt (€)',500],['Höchstbetrag, den Jane zu zahlen bereit ist (€)',800]],
  ex:'Jede Zahlung zwischen 500 € und 800 € stellt beide besser. Der Hund geht, und das ist effizient, weil der Schaden (800 €) größer ist als der Nutzen (500 €). Hätte Jane das Recht auf Ruhe, wäre der Hund ebenfalls weg: Dick könnte ihr höchstens 500 € bieten, sie verlangt mindestens 800 €.'},
 {t:'mc',text:'Warum funktionieren private Lösungen beim Klimawandel nicht?',
  opts:['Weil sehr viele Parteien betroffen sind, die Transaktionskosten hoch sind und Koordinationsprobleme entstehen.','Weil es keine externen Kosten gibt.','Weil das Coase-Theorem den Klimawandel ausdrücklich ausnimmt.','Weil die Eigentumsrechte am Klima klar definiert sind.'],c:0,
  ex:'Milliarden Verursacher und Betroffene können nicht miteinander verhandeln. Genau dann ist es sinnvoll, dass der Staat eingreift.'},
 {t:'mc',text:'Deine WG plant eine Party, die Nachbarn werden durch den Lärm gestört. Welche Lösung ist eine private Lösung im Sinne der Vorlesung?',
  opts:['Du lädst die Nachbarn ein oder bietest ihnen etwas an, damit sie den Lärm akzeptieren.','Die Nachbarn rufen die Polizei.','Die Stadt verhängt eine Lärmsteuer.','Der Gesetzgeber verbietet Partys nach 22 Uhr.'],c:0,
  ex:'Eine Absprache oder Entschädigung zwischen den Betroffenen ist eine private Lösung. Die anderen drei sind staatliche Eingriffe.'}
]},
{n:'Staatliche Maßnahmen',d:'Kap. 9 · Ge- und Verbote, Pigou-Steuer, handelbare Zertifikate.',fig:G8.negT,T:[
 {t:'sort',text:'Ge- und Verbot oder marktbasierte Maßnahme?',cats:['Ge- oder Verbot','marktbasiert'],
  items:[['Impfzwang',0],['Pflicht zum Einbau von Katalysatoren',0],['Verbot von Glühbirnen',0],['Pigou-Steuer',1],['Handelbare Umweltzertifikate',1],['Festlegung von Emissionsniveaus',0],['Subvention für Impfungen',1]],
  ex:'Ge- und Verbote schreiben Verhalten direkt vor. Marktbasierte Maßnahmen verändern Preise und überlassen die Entscheidung den Akteuren.'},
 {t:'mc',text:'Was ist eine Pigou-Steuer?',
  opts:['Eine Steuer zur Korrektur (Internalisierung) negativer externer Effekte.','Eine Steuer auf alle Güter in gleicher Höhe.','Eine Steuer, die nur Konsumenten zahlen.','Eine Steuer auf öffentliche Güter.'],c:0,
  ex:'Sie ist nach dem Ökonomen Arthur Pigou benannt. Anders als die meisten Steuern verursacht sie keinen Wohlfahrtsverlust, sondern beseitigt einen, wenn sie so hoch ist wie die externen Kosten.'},
 {t:'mc',text:'Welchen Vorteil hat eine Pigou-Steuer gegenüber einer festen Vorschrift für jedes Unternehmen?',
  opts:['Die Verschmutzung wird dort verringert, wo die Vermeidung am wenigsten kostet.','Jedes Unternehmen muss genau gleich viel einsparen.','Sie bringt dem Staat keine Einnahmen.','Sie ist für alle Unternehmen kostenlos.'],c:0,
  ex:'Wer billig vermeiden kann, vermeidet, um die Steuer zu sparen. Wer teure Vermeidungskosten hat, zahlt lieber die Steuer. So wird dasselbe Umweltziel mit geringeren Gesamtkosten erreicht.'},
 {t:'sort',text:'Pigou-Steuer von 50 € je Tonne CO₂. Was macht jedes Unternehmen? (Vermeidungskosten je Tonne)',cats:['vermeidet','zahlt die Steuer'],
  items:[['Firma A: 20 €',0],['Firma B: 80 €',1],['Firma C: 45 €',0],['Firma D: 120 €',1]],
  ex:'Ist Vermeiden billiger als 50 €, vermeidet die Firma. Ist es teurer, zahlt sie die Steuer. Vermieden wird also genau bei den Firmen mit niedrigen Vermeidungskosten.'},
 {t:'mc',text:'Wie funktionieren handelbare Umweltzertifikate?',
  opts:['Der Staat legt die Menge an Verschmutzungsrechten fest, Unternehmen handeln sie, und es entsteht ein Preis.','Der Staat legt einen Preis je Tonne fest, die Menge ergibt sich.','Jedes Unternehmen darf so viel verschmutzen, wie es will, muss aber ein Zertifikat vorzeigen.','Zertifikate werden nur an Unternehmen mit hohen Vermeidungskosten vergeben.'],c:0,
  ex:'Wer billig vermeiden kann, verkauft seine Zertifikate an Firmen mit hohen Vermeidungskosten. Auch hier wird also dort vermieden, wo es am günstigsten ist.'},
 {t:'sort',text:'Pigou-Steuer oder Zertifikate: Was legt der Staat fest, was ergibt sich am Markt?',
  items:[['Pigou-Steuer: der Staat legt fest …',0,['den Preis der Verschmutzung','die Menge der Verschmutzung']],['Pigou-Steuer: am Markt ergibt sich …',1,['der Preis der Verschmutzung','die Menge der Verschmutzung']],['Zertifikate: der Staat legt fest …',1,['den Preis der Verschmutzung','die Menge der Verschmutzung']],['Zertifikate: am Markt ergibt sich …',0,['der Preis der Verschmutzung','die Menge der Verschmutzung']]],
  ex:'Das ist die Äquivalenz aus der Vorlesung: Die Steuer setzt den Preis, und die Nachfrage nach Verschmutzung bestimmt die Menge. Die Zertifikate setzen die Menge, und dieselbe Nachfrage bestimmt den Preis. Bei bekannter Nachfrage kann man mit beiden dasselbe Ergebnis erreichen.'},
 {t:'mc',text:'Der Staat kennt die Nachfrage nach Verschmutzungsrechten nicht genau, will aber eine feste Höchstmenge an Emissionen sicher einhalten. Was ist besser geeignet?',
  opts:['Handelbare Zertifikate, weil sie die Menge direkt festlegen.','Eine Pigou-Steuer, weil sie die Menge direkt festlegt.','Beides ist in diesem Fall gleich gut.','Keines von beiden.'],c:0,
  ex:'Bei der Steuer steht der Preis fest, die Menge hängt von der Nachfrage ab und kann höher ausfallen als geplant. Bei Zertifikaten steht die Menge fest, nur der Preis ist unsicher.'}
]},
{n:'Klausur',d:'Kap. 9 · Die alte Klausuraufgabe Schritt für Schritt (mit kleinen Zahlen).',fig:G8.kl,T:[
 {t:'mc',text:'Alte Klausur: Q<sup>S</sup>(P) = −12 + 3P, Q<sup>D</sup>(P) = 28 − P mit P* = 10 und Q* = 18. Die Nachfrage, die den volkswirtschaftlichen Wert widerspiegelt, lautet Q<sup>D</sup><sub>V</sub>(P) = 36 − P. Wie findest du die sozial optimale Menge?',fig:G8.kl,
  opts:['Q<sup>D</sup><sub>V</sub> mit dem Angebot gleichsetzen.','Q<sup>D</sup> mit dem Angebot gleichsetzen.','Q<sup>D</sup><sub>V</sub> mit Q<sup>D</sup> gleichsetzen.','Q* um 8 erhöhen.'],c:0,
  ex:'Das Optimum liegt dort, wo der volkswirtschaftliche Wert den Kosten entspricht: 36 − P = −12 + 3P. B liefert das Marktgleichgewicht, das schon gegeben ist.'},
 {t:'calc',text:'a) Rechne die sozial optimale Menge aus: 36 − P = −12 + 3P. (Leichte Rechnung)',fig:G8.kl,
  fields:[['Preis im Optimum',12],['Sozial optimale Menge',24]],
  ex:'36 + 12 = 4P, also P = 12. Menge: 36 − 12 = 24 (Probe: −12 + 36 = 24).'},
 {t:'mc',text:'c) Liegt eine positive oder eine negative Externalität vor?',fig:G8.kl,
  opts:['Positiv: Der volkswirtschaftliche Wert liegt über dem privaten Wert, und die optimale Menge (24) liegt über der Marktmenge (18).','Negativ: Die optimale Menge liegt unter der Marktmenge.','Negativ: Die volkswirtschaftlichen Kosten liegen über den privaten Kosten.','Es liegt keine Externalität vor.'],c:0,
  ex:'Q<sup>D</sup><sub>V</sub> liegt bei jedem Preis um 8 Einheiten rechts von Q<sup>D</sup>, also um 8 € über der privaten Nachfrage. Das heißt: Jede Einheit stiftet Dritten 8 € zusätzlichen Nutzen. Positive Externalität, der Markt produziert zu wenig.'},
 {t:'calc',text:'d) Wohlfahrtsverlust: Bei der Marktmenge 18 ist der volkswirtschaftliche Wert 36 − 18 = 18, die Kosten sind 10. Im Optimum (24) treffen sich beide bei 12. (Kopfrechnen)',fig:G8.kl,
  formula:['NWL = ½ · Höhe · Breite'],
  fields:[['Höhe des Dreiecks (Abstand bei Q = 18)',8],['Breite des Dreiecks (Mengendifferenz)',6],['Wohlfahrtsverlust',24]],
  ex:'Höhe: 18 − 10 = 8, das ist genau der externe Nutzen je Einheit. Breite: 24 − 18 = 6. Fläche: ½ · 8 · 6 = 24. Im Diagramm ist das das rote Dreieck rechts vom Marktgleichgewicht.'},
 {t:'calc',text:'e) Bei welchem Preis würde die optimale Menge 24 nachgefragt (private Nachfrage 28 − P), bei welchem angeboten (−12 + 3P)? (Kopfrechnen)',fig:G8.klS,
  fields:[['Preis, bei dem 24 nachgefragt werden',4],['Preis, bei dem 24 angeboten werden',12],['Nötige Subvention je Einheit',8]],
  ex:'Nachfrage: 28 − P = 24 ⇒ P = 4. Angebot: −12 + 3P = 24 ⇒ P = 12. Eine Subvention von 12 − 4 = 8 je Einheit sorgt dafür, dass die Käufer 4 zahlen und die Anbieter 12 erhalten. Das ist genau der externe Nutzen je Einheit.'},
 {t:'mc',text:'Welche Aussage ist FALSCH?',
  opts:['Eine Pigou-Steuer verursacht immer einen zusätzlichen Wohlfahrtsverlust.','Bei negativen Externalitäten liegt die Marktmenge über dem sozialen Optimum.','Das Coase-Theorem setzt klar definierte Eigentumsrechte und geringe Transaktionskosten voraus.','Öffentliche Güter sind weder ausschließbar noch rivalisierend.'],c:0,
  ex:'A ist falsch: Eine Pigou-Steuer in Höhe der externen Kosten beseitigt den Wohlfahrtsverlust, statt einen zu verursachen. B, C und D stimmen.'},
 {t:'mc',text:'Welche Aussage ist richtig?',
  opts:['Bei öffentlichen Gütern kommt es wegen des Trittbrettfahrerproblems im Allgemeinen zu einer Unterversorgung.','Allmendegüter sind ausschließbar.','Positive Externalitäten führen zu Überproduktion.','Volkswirtschaftliche Kosten sind private Kosten minus externe Kosten.'],c:0,
  ex:'A steht so in der Zusammenfassung der Vorlesung. Allmendegüter sind gerade nicht ausschließbar, positive Externalitäten führen zu Unterproduktion, und die volkswirtschaftlichen Kosten sind die Summe aus privaten und externen Kosten.'}
]},
{n:'Rechentraining',d:'Kap. 3 bis 9 · Mehrteilige Rechenaufgaben: Externalitäten mit Renten, Steuerkeil, Inzidenz und Elastizität.',fig:k=>extScene({...RA,showOpt:k>0,labels:1,sl:'Volksw. Kosten'}),T:[
 {t:'calc',text:'<b>Fall Aluminium I.</b> Q<sup>D</sup> = 120 − 2P und Q<sup>S</sup> = 3P − 30 (private Kosten). Jede Tonne verursacht externe Kosten von 10 €.',fig:G8.ra,
  formula:['Volksw. Kosten: Q = 3(P − 10) − 30','ε = dQ/dP · P/Q'],
  fields:[['Marktpreis',30],['Marktmenge',60],['Preiselastizität der Nachfrage im Marktgleichgewicht',-1],['Preis im sozialen Optimum',36],['Sozial optimale Menge',48],['Wohlfahrtsverlust',60]],
  ex:'Markt: 120 − 2P = 3P − 30 ⇒ 150 = 5P ⇒ P = 30, Q = 60. Elastizität: −2 · 30/60 = −1. Volkswirtschaftliche Kosten: Die Anbieter bräuchten für jede Menge 10 € mehr, also Q = 3(P − 10) − 30 = 3P − 60. Optimum: 120 − 2P = 3P − 60 ⇒ 180 = 5P ⇒ P = 36, Q = 48. NWL = ½ · 10 · (60 − 48) = 60.'},
 {t:'calc',text:'<b>Fall Aluminium II.</b> Gleicher Markt. Der Staat erhebt eine Pigou-Steuer von 10 € je Tonne.',fig:G8.raT,
  formula:['P<sup>D</sup> = P<sup>S</sup> + T'],
  fields:[['Preis, den die Käufer zahlen',36],['Preis, den die Werke behalten',26],['Gehandelte Menge',48],['Steueraufkommen',480],['Anteil der Käufer an der Steuerlast (%)',60]],
  ex:'120 − 2(P<sup>S</sup> + 10) = 3P<sup>S</sup> − 30 ⇒ 130 = 5P<sup>S</sup> ⇒ P<sup>S</sup> = 26, P<sup>D</sup> = 36, Q = 48. Das ist genau das Optimum. Aufkommen: 10 · 48 = 480. Die Käufer zahlen 6 € mehr als vorher (36 statt 30), also 6 von 10 = 60 %. Kontrolle über die Elastizitäten im Marktgleichgewicht: ε<sub>S</sub> = 3 · 30/60 = 1,5 und |ε<sub>D</sub>| = 1, Käuferanteil = 1,5 / 2,5 = 60 %.'},
 {t:'calc',text:'<b>Fall Aluminium III.</b> Wohlfahrt vor und nach der Pigou-Steuer. Die Nachfrage endet bei P = 60, das Angebot beginnt bei P = 10. Wohlfahrt = Konsumentenrente + Produzentenrente + Steueraufkommen − gesamte externe Kosten.',fig:G8.raT,
  formula:['W = CS + PS + R − externe Kosten'],
  fields:[['Konsumentenrente vorher',900],['Produzentenrente vorher',600],['Externe Kosten vorher',600],['Wohlfahrt vorher',900],['Konsumentenrente nachher',576],['Produzentenrente nachher',384],['Wohlfahrt nachher',960]],
  ex:'Vorher (Q = 60, P = 30): CS = ½ · 60 · (60 − 30) = 900, PS = ½ · 60 · (30 − 10) = 600, externe Kosten = 10 · 60 = 600, W = 900 + 600 − 600 = 900. Nachher (Q = 48, Käufer 36, Werke 26): CS = ½ · 48 · 24 = 576, PS = ½ · 48 · 16 = 384, Aufkommen 480, externe Kosten 10 · 48 = 480, W = 576 + 384 + 480 − 480 = 960. Die Wohlfahrt steigt um 60, genau um den vorherigen Wohlfahrtsverlust. Anders als in Kapitel 7 korrigiert die Steuer hier einen Fehler, statt einen zu verursachen.'},
 {t:'calc',text:'<b>Fall Impfung.</b> Q<sup>D</sup> = 80 − 4P und Q<sup>S</sup> = 4P − 16. Jede Impfung stiftet Dritten einen zusätzlichen Nutzen von 6 €.',fig:G8.rb,
  formula:['Volksw. Wert: Q = 80 − 4(P − 6)'],
  fields:[['Marktmenge',32],['Sozial optimale Menge',44],['Wohlfahrtsverlust ohne Eingriff',36],['Preis der Käufer mit Subvention von 6 €',9],['Preis der Anbieter mit Subvention',15],['Subventionsausgaben',264]],
  ex:'Markt: 80 − 4P = 4P − 16 ⇒ P = 12, Q = 32. Volkswirtschaftlicher Wert: Für jede Menge ist die Zahlungsbereitschaft der Gesellschaft 6 € höher, also Q = 80 − 4(P − 6) = 104 − 4P. Optimum: 104 − 4P = 4P − 16 ⇒ 120 = 8P ⇒ P = 15, Q = 44. NWL = ½ · 6 · 12 = 36. Mit Subvention: Die Käufer fragen 44 nach, wenn 80 − 4P = 44, also P = 9. Die Anbieter bieten 44 an bei 4P − 16 = 44, also P = 15. Abstand 6 = Subvention. Ausgaben: 6 · 44 = 264.'},
 {t:'calc',text:'<b>Fall rückwärts.</b> Q<sup>D</sup> = 100 − 2P, das private Angebot ist Q<sup>S</sup> = 2P − 20, die volkswirtschaftlichen Kosten werden durch Q<sup>S</sup><sub>V</sub> = 2P − 40 beschrieben.',fig:G8.rc,
  fields:[['Externe Kosten je Einheit',10],['Marktmenge',40],['Sozial optimale Menge',30],['Wohlfahrtsverlust',50],['Käuferpreis mit passender Pigou-Steuer',35],['Verkäuferpreis mit passender Pigou-Steuer',25]],
  ex:'Nach P aufgelöst: privat P = Q/2 + 10, volkswirtschaftlich P = Q/2 + 20. Der Abstand ist bei jeder Menge 10, das sind die externen Kosten. Markt: 100 − 2P = 2P − 20 ⇒ P = 30, Q = 40. Optimum: 100 − 2P = 2P − 40 ⇒ P = 35, Q = 30. NWL = ½ · 10 · 10 = 50. Pigou-Steuer 10: Die Käufer zahlen 35, die Verkäufer behalten 25 (2 · 25 − 20 = 30 ✓).'},
 {t:'calc',text:'<b>Vorschrift oder Pigou-Steuer?</b> Zwei Fabriken stoßen je 100 t aus, insgesamt sollen 100 t vermieden werden. Fabrik A kann eine Tonne für 20 € vermeiden, Fabrik B nur für 60 €. Variante 1: Vorschrift, jede Fabrik vermeidet 50 t. Variante 2: Pigou-Steuer von 40 € je ausgestoßener Tonne.',
  fields:[['Vermeidungskosten insgesamt mit Vorschrift (€)',4000],['Vermiedene Tonnen mit Steuer insgesamt',100],['Vermeidungskosten insgesamt mit Steuer (€)',2000],['Steuerzahlung von Fabrik B (€)',4000],['Ersparnis an Vermeidungskosten durch die Steuer (€)',2000]],
  ex:'Vorschrift: 50 · 20 + 50 · 60 = 1.000 + 3.000 = 4.000 €. Steuer 40 €: Für A ist Vermeiden (20 €) billiger als die Steuer, also vermeidet A alle 100 t für 2.000 €. Für B ist Vermeiden (60 €) teurer, also zahlt B für 100 t je 40 € = 4.000 € Steuer. Vermieden werden wieder 100 t, aber für nur 2.000 € statt 4.000 €. Genau das meint die Folie: Vermieden wird dort, wo es am billigsten ist.'},
 {t:'calc',text:'<b>Zertifikate statt Steuer.</b> Gleiche Fabriken. Jede erhält Zertifikate für 50 t Ausstoß. Die Zertifikate werden zu 40 € je Tonne gehandelt.',
  fields:[['Zertifikate, die A an B verkauft (t)',50],['Erlös von A aus dem Verkauf (€)',2000],['Vorteil von A gegenüber der Vorschrift (€)',1000],['Vorteil von B gegenüber der Vorschrift (€)',1000]],
  ex:'A vermeidet für 20 € je Tonne, ein Zertifikat bringt aber 40 €. Also vermeidet A alle 100 t und verkauft seine 50 Zertifikate an B: Erlös 2.000 €, zusätzliche Vermeidung 50 · 20 = 1.000 €, Vorteil 1.000 €. B kauft 50 Zertifikate für 2.000 € statt 50 t für 3.000 € zu vermeiden, Vorteil 1.000 €. Zusammen 2.000 € gespart, dasselbe Ergebnis wie mit der Steuer. Jeder Preis zwischen 20 € und 60 € würde beiden nützen.'},
 {t:'calc',text:'<b>Öffentliches Gut.</b> Drei Nachbarn überlegen, einen gemeinsamen Spielplatz zu bauen, den niemand absperren kann. Anna ist er 40 € wert, Ben 25 €, Cem 15 €. Er kostet 60 €.',
  fields:[['Gesamte Zahlungsbereitschaft (€)',80],['Nettonutzen des Spielplatzes (€)',20],['Beitrag je Person bei gleicher Aufteilung (€)',20],['Konsumentenrente von Anna bei gleicher Aufteilung (€)',20],['Konsumentenrente von Cem bei gleicher Aufteilung (€)',-5]],
  ex:'40 + 25 + 15 = 80 € > 60 €, also lohnt sich der Bau mit 20 € Nettonutzen. Bei 20 € je Person: Anna 40 − 20 = 20, Ben 5, Cem 15 − 20 = −5. Zusammen wieder 20. Cem würde gegen eine gleiche Kopfsteuer stimmen, obwohl der Spielplatz insgesamt effizient ist. Und freiwillig würde jeder hoffen, dass die anderen zahlen (Trittbrettfahrer), weil niemand ausgeschlossen werden kann.'},
 {t:'calc',text:'<b>Coase mit Transaktionskosten.</b> Eine Fabrik leitet Abwasser in einen See und schadet damit einem Fischer um 800 €. Ein Filter würde die Fabrik 500 € kosten. Die Fabrik hat das Recht, einzuleiten.',
  fields:[['Mindestzahlung, damit die Fabrik den Filter einbaut (€)',500],['Höchstzahlung, die der Fischer leisten würde (€)',800],['Gesamter Vorteil einer Einigung (€)',300],['Transaktionskosten, ab denen die Einigung scheitert (mehr als … €)',300]],
  ex:'Der Fischer zahlt zwischen 500 € und 800 €, dann baut die Fabrik den Filter. Gemeinsam gewinnen beide 800 − 500 = 300 €. Kosten Verhandlung, Anwälte und Kontrolle mehr als 300 €, lohnt sich die Einigung nicht mehr, und der Filter wird nicht gebaut, obwohl er effizient wäre. Genau deshalb verlangt das Coase-Theorem geringe Transaktionskosten.'}
]},
{n:'Rechentraining II',d:'Kap. 3 bis 9 · Neue mehrteilige Fälle: Zement, zu hohe Steuer, Solar, Klausurstil, Straßenbeleuchtung, drei Fabriken, Coase, Elastizität.',fig:k=>extScene({...ZC,showOpt:k>0,labels:1,sl:'Volksw. Kosten'}),T:[
 {t:'calc',text:'<b>Fall Zement I.</b> Q<sup>D</sup> = 90 − 3P und Q<sup>S</sup> = 2P − 10 (private Kosten). Jede Tonne verursacht externe Kosten von 5 €.',fig:G8.zc,
  formula:['Volksw. Kosten: Q = 2(P − 5) − 10','ε = dQ/dP · P/Q'],
  fields:[['Marktpreis',20],['Marktmenge',30],['Preiselastizität der Nachfrage im Marktgleichgewicht',-2],['Preis im sozialen Optimum',22],['Sozial optimale Menge',24],['Wohlfahrtsverlust',15]],
  ex:'Markt: 90 − 3P = 2P − 10 ⇒ 100 = 5P ⇒ P = 20, Q = 30. Elastizität: −3 · 20/30 = −2. Volkswirtschaftliche Kosten: Q = 2(P − 5) − 10 = 2P − 20. Optimum: 90 − 3P = 2P − 20 ⇒ 110 = 5P ⇒ P = 22, Q = 24. NWL = ½ · 5 · (30 − 24) = 15.'},
 {t:'calc',text:'<b>Fall Zement II.</b> Gleicher Markt, Pigou-Steuer von 5 € je Tonne.',fig:G8.zcT,
  formula:['P<sup>D</sup> = P<sup>S</sup> + T'],
  fields:[['Preis, den die Käufer zahlen',22],['Preis, den die Hersteller behalten',17],['Steueraufkommen',120],['Anteil der Käufer an der Steuerlast (%)',40]],
  ex:'90 − 3(P<sup>S</sup> + 5) = 2P<sup>S</sup> − 10 ⇒ 85 = 5P<sup>S</sup> ⇒ P<sup>S</sup> = 17, P<sup>D</sup> = 22, Q = 24. Aufkommen: 5 · 24 = 120. Die Käufer zahlen 2 € mehr (22 statt 20), also 2 von 5 = 40 %. Diesmal tragen die Hersteller mehr, weil die Nachfrage elastischer ist: ε<sub>S</sub> = 2 · 20/30 = 4/3, |ε<sub>D</sub>| = 2, Käuferanteil = (4/3) / (4/3 + 2) = 40 %.'},
 {t:'calc',text:'<b>Fall Zement III.</b> Wohlfahrt vor und nach der Pigou-Steuer. Die Nachfrage endet bei P = 30, das Angebot beginnt bei P = 5.',fig:G8.zcT,
  formula:['W = CS + PS + R − externe Kosten'],
  fields:[['Konsumentenrente vorher',150],['Produzentenrente vorher',225],['Externe Kosten vorher',150],['Wohlfahrt vorher',225],['Konsumentenrente nachher',96],['Produzentenrente nachher',144],['Wohlfahrt nachher',240]],
  ex:'Vorher (Q = 30, P = 20): CS = ½ · 30 · 10 = 150, PS = ½ · 30 · 15 = 225, externe Kosten 5 · 30 = 150, W = 150 + 225 − 150 = 225. Nachher (Q = 24, Käufer 22, Hersteller 17): CS = ½ · 24 · 8 = 96, PS = ½ · 24 · 12 = 144, Aufkommen 120, externe Kosten 5 · 24 = 120, W = 96 + 144 + 120 − 120 = 240. Plus 15, genau der vorherige Wohlfahrtsverlust.'},
 {t:'calc',text:'<b>Zu hohe Steuer.</b> Gleicher Zementmarkt, aber der Staat übertreibt und verlangt 10 € je Tonne statt 5 €.',fig:G8.zc,
  fields:[['Preis, den die Käufer zahlen',24],['Preis, den die Hersteller behalten',14],['Gehandelte Menge',18],['Steueraufkommen',180],['Wohlfahrtsverlust gegenüber dem Optimum',15]],
  ex:'90 − 3(P<sup>S</sup> + 10) = 2P<sup>S</sup> − 10 ⇒ 70 = 5P<sup>S</sup> ⇒ P<sup>S</sup> = 14, P<sup>D</sup> = 24, Q = 18. Aufkommen 10 · 18 = 180. Jetzt wird zu wenig produziert: 6 t unter dem Optimum. Bei Q = 18 sind die Käufer bereit, 24 zu zahlen, die volkswirtschaftlichen Kosten sind (18 + 20)/2 = 19. Dreieck: ½ · 5 · 6 = 15. Eine Pigou-Steuer korrigiert nur, wenn sie so hoch ist wie die externen Kosten.'},
 {t:'calc',text:'<b>Fall Solar.</b> Q<sup>D</sup> = 60 − 2P und Q<sup>S</sup> = 3P − 15. Jede Solaranlage hat für die Gesellschaft einen zusätzlichen Nutzen von 5 €.',fig:G8.sol,
  formula:['Volksw. Wert: Q = 60 − 2(P − 5)'],
  fields:[['Marktmenge',30],['Sozial optimale Menge',36],['Wohlfahrtsverlust ohne Eingriff',15],['Preis der Käufer mit Subvention von 5 €',12],['Preis der Anbieter mit Subvention',17],['Subventionsausgaben',180]],
  ex:'Markt: 60 − 2P = 3P − 15 ⇒ P = 15, Q = 30. Volkswirtschaftlicher Wert: Q = 70 − 2P. Optimum: 70 − 2P = 3P − 15 ⇒ 85 = 5P ⇒ P = 17, Q = 36. NWL = ½ · 5 · 6 = 15. Subvention: Käufer fragen 36 nach bei 60 − 2P = 36 ⇒ P = 12, Anbieter bieten 36 an bei 3P − 15 = 36 ⇒ P = 17. Ausgaben 5 · 36 = 180. Die Käufer zahlen 3 € weniger, die Anbieter bekommen 2 € mehr.'},
 {t:'calc',text:'<b>Klausurstil.</b> Q<sup>S</sup>(P) = 2P − 20 und Q<sup>D</sup>(P) = 40 − P. Die Nachfrage, die den volkswirtschaftlichen Wert widerspiegelt, lautet Q<sup>D</sup><sub>V</sub>(P) = 46 − P.',fig:G8.k4,
  fields:[['Marktgleichgewicht: Menge',20],['Externer Nutzen je Einheit',6],['Sozial optimale Menge',24],['Wohlfahrtsverlust',12],['Preis, bei dem die optimale Menge nachgefragt wird',16],['Preis, bei dem die optimale Menge angeboten wird',22]],
  ex:'Markt: 40 − P = 2P − 20 ⇒ P = 20, Q = 20. Nach P aufgelöst: privat P = 40 − Q, volkswirtschaftlich P = 46 − Q, also 6 € externer Nutzen je Einheit (positive Externalität). Optimum: 46 − P = 2P − 20 ⇒ 66 = 3P ⇒ P = 22, Q = 24. NWL = ½ · 6 · 4 = 12. Nachgefragt wird 24 bei 40 − P = 24 ⇒ P = 16, angeboten bei P = 22. Eine Subvention von 6 je Einheit schließt die Lücke.'},
 {t:'calc',text:'<b>Öffentliches Gut mit Ausbaustufe.</b> Eine Stadt mit 50.000 Einwohnern plant eine neue Straßenbeleuchtung. Im Schnitt ist sie jedem 4 € wert, sie kostet 150.000 €. Eine größere Variante würde 100.000 € mehr kosten, und die Zahlungsbereitschaft je Einwohner würde um 1,50 € steigen.',
  fields:[['Gesamte Zahlungsbereitschaft Grundvariante (€)',200000],['Nettonutzen der Grundvariante (€)',50000],['Kopfsteuer für die Grundvariante (€)',3],['Zusätzliche Zahlungsbereitschaft durch die größere Variante (€)',75000],['Nettoeffekt des Ausbaus (€)',-25000]],
  ex:'50.000 · 4 € = 200.000 €, Nettonutzen 50.000 €, Kopfsteuer 150.000 / 50.000 = 3 €. Ausbau: 50.000 · 1,50 € = 75.000 € zusätzlicher Nutzen bei 100.000 € Zusatzkosten, also −25.000 €. Die Grundvariante lohnt sich, der Ausbau nicht. Auch bei öffentlichen Gütern zählt jede zusätzliche Stufe für sich.'},
 {t:'calc',text:'<b>Drei Fabriken.</b> A, B und C stoßen je 45 t aus, insgesamt sollen 90 t vermieden werden. Vermeidungskosten je Tonne: A 10 €, B 30 €, C 70 €. Variante 1: Vorschrift, jede Fabrik vermeidet 30 t. Variante 2: Pigou-Steuer von 40 € je ausgestoßener Tonne.',
  fields:[['Vermeidungskosten mit Vorschrift (€)',3300],['Vermiedene Tonnen mit Steuer',90],['Vermeidungskosten mit Steuer (€)',1800],['Steuerzahlung von C (€)',1800],['Ersparnis durch die Steuer (€)',1500]],
  ex:'Vorschrift: 30 · 10 + 30 · 30 + 30 · 70 = 300 + 900 + 2.100 = 3.300 €. Steuer 40 €: A (10 €) und B (30 €) vermeiden alles, je 45 t, zusammen 90 t, Kosten 450 + 1.350 = 1.800 €. C (70 €) zahlt lieber 45 · 40 = 1.800 € Steuer. Gleiche Vermeidung, 1.500 € billiger.'},
 {t:'calc',text:'<b>Coase umgekehrt.</b> Ein Club macht Lärm. Für den Club ist der laute Betrieb 1.200 € wert, die Anwohner haben einen Schaden von 900 €. Die Anwohner haben das Recht auf Ruhe.',
  fields:[['Mindestbetrag, den die Anwohner verlangen (€)',900],['Höchstbetrag, den der Club zahlen würde (€)',1200],['Gesamter Vorteil der Einigung (€)',300]],
  ex:'Der Club zahlt zwischen 900 € und 1.200 € und darf laut sein. Das ist effizient, weil der Nutzen (1.200 €) den Schaden (900 €) übersteigt. Hätte der Club das Recht, würden die Anwohner höchstens 900 € bieten, der Club verlangt mindestens 1.200 €: Der Lärm bleibt ebenfalls. Das Ergebnis ist gleich, nur wer an wen zahlt, ändert sich. Das ist die Kernaussage des Coase-Theorems.'},

const lab8={type:'neg',e:2,corr:false};
function renderLab8(){
  animId++; dragCb=null; areaCb=null; levelsEl.hidden=true; minibox.hidden=true;
  panel.innerHTML=`<div class="lab"><h2>Externalitäten und Korrektur</h2><p>Markt mit Q<sup>D</sup> = 100 − 10P und Q<sup>S</sup> = 10P − 20. Wähle die Art des externen Effekts, seine Größe je Einheit und ob der Staat eingreift.</p>
   <div class="seg" id="ty8" style="margin-bottom:10px"><button data-v="neg">Negativ (z. B. Abgase)</button><button data-v="pos">Positiv (z. B. Bildung)</button></div>
   <div class="sl2"><div class="top"><span>Externer Effekt je Einheit</span><span id="v8e"></span></div><input type="range" id="r8e" min="0" max="4" step="0.5" value="${lab8.e}" aria-label="Externer Effekt"></div>
   <div class="seg" id="co8" style="margin-bottom:12px"><button data-v="0">Kein Eingriff</button><button data-v="1" id="co8b"></button></div>
   <div class="readout" id="ro8"></div><div class="note" id="n8"></div></div>`;
  const re=document.getElementById('r8e');
  const upd=()=>{
    const neg=lab8.type==='neg', o={...AL,type:lab8.type,e:lab8.e}, r=extCalc(o);
    re.value=lab8.e; document.getElementById('v8e').textContent=eur(lab8.e);
    document.getElementById('co8b').textContent=neg?'Pigou-Steuer':'Subvention';
    panel.querySelectorAll('#ty8 button').forEach(b=>b.classList.toggle('on',b.dataset.v===lab8.type));
    panel.querySelectorAll('#co8 button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===lab8.corr));
    drawScene(extScene({...o,x:neg?'Aluminiummenge':'Menge an Bildung',y:'Preis',showOpt:1,nwl:!lab8.corr,corr:lab8.corr,labels:1,sl:'Volksw. Kosten',dl:'Volksw. Wert'}));
    const Qn=lab8.corr?r.op.Q:r.m.Q;
    const rows=[['Marktmenge ohne Eingriff',fmt(r.m.Q,1)],['Sozial optimale Menge',fmt(r.op.Q,1)],['Gehandelte Menge',fmt(Qn,1)],['Wohlfahrtsverlust',eur(lab8.corr?0:r.nwl)]];
    if(lab8.corr&&lab8.e>0) rows.push([neg?'Steueraufkommen':'Subventionsausgaben',eur(lab8.e*r.op.Q)]);
    document.getElementById('ro8').innerHTML=rd(rows);
    let n; if(lab8.e===0) n='<b>Kein externer Effekt.</b> Private und volkswirtschaftliche Kurven fallen zusammen, das Marktgleichgewicht ist effizient.';
    else if(!lab8.corr) n=neg?`<b>Zu viel Produktion.</b> Die Produzenten rechnen nur mit ihren privaten Kosten. Es werden ${fmt(r.m.Q-r.op.Q,1)} Einheiten zu viel hergestellt.`:`<b>Zu wenig Produktion.</b> Die Käufer berücksichtigen nur ihren eigenen Nutzen. Es fehlen ${fmt(r.op.Q-r.m.Q,1)} Einheiten.`;
    else n=neg?`<b>Pigou-Steuer von ${eur(lab8.e)}.</b> Die Angebotskurve wandert genau auf die volkswirtschaftlichen Kosten, der Markt landet im Optimum. Der Wohlfahrtsverlust verschwindet.`:`<b>Subvention von ${eur(lab8.e)}.</b> Käufer zahlen weniger, Anbieter erhalten mehr, und der Markt landet im Optimum.`;
    document.getElementById('n8').innerHTML=n;
  };
  re.oninput=()=>{lab8.e=+re.value;upd();};
  panel.querySelectorAll('#ty8 button').forEach(b=>b.onclick=()=>{lab8.type=b.dataset.v;upd();});
  panel.querySelectorAll('#co8 button').forEach(b=>b.onclick=()=>{lab8.corr=b.dataset.v==='1';upd();});
  upd();
}

function rngV(seed){let a=seed>>>0;return ()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
const deV=n=>(Math.round(n*100)/100).toLocaleString('de-DE');
const euV=n=>deV(n)+' €';
const pickV=(R,a)=>a[Math.floor(R()*a.length)];
function shufV(R,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const NM=['A','B','C','D'];
const CPOOL=[2,3,4,5,6,8,10,12,15,16,18,20,24,25,30,35,40,45,50,60,70,80];
// Ein Fall: n Fabriken, je E t Ausstoß, Vermeidungskosten c (aufsteigend), m Fabriken vermeiden bei Steuer T
function caseV(R,o={}){
  const n=o.n||(R()<0.5?3:4), E=pickV(R,n===3?[6,9,12,15,30]:[8,12,16,20]);
  let c; for(let k=0;k<200;k++){ c=shufV(R,CPOOL).slice(0,n).sort((x,y)=>x-y); let ok=true; for(let i=1;i<n;i++) if(c[i]-c[i-1]<3) ok=false; if(ok) break; }
  const m=o.m||1+Math.floor(R()*(n-1));
  const lo=c[m-1], hi=c[m]; let cand=[]; for(let t=lo+1;t<hi;t++) cand.push(t);
  const c5=cand.filter(t=>t%5===0); const T=pickV(R,c5.length?c5:cand);
  const v=m*E/n, sum=c.reduce((s,x)=>s+x,0);
  const K={n,E,c,m,T,v,nm:NM.slice(0,n),target:m*E};
  K.vors=v*sum; K.cost=E*c.slice(0,m).reduce((s,x)=>s+x,0); K.rev=(n-m)*E*T; K.save=K.vors-K.cost;
  K.allow=E-v; K.list=c.map((x,i)=>`${NM[i]} ${x} €`).join(', ');
  K.intro=`${n} Fabriken stoßen je ${E} t aus. Vermeidungskosten je Tonne: ${K.list}.`;
  return K;
}
function stairV(K,o={}){
  const tot=K.n*K.E, S={Pmax:Math.max(...K.c)*1.2,Qmax:tot*1.04,x:'Tonnen, sortiert nach Vermeidungskosten',y:'€ je Tonne',curves:[],points:[],rects:[],lines:[],polys:[],extra:'',legend:[]};
  K.c.forEach((c,i)=>{ const x0=i*K.E,x1=x0+K.E; const kind=o.T==null?'ps':(c<o.T?'cs':(c===o.T?'tax':'neutral'));
    S.polys.push({id:K.nm[i],pts:[[x0,0],[x1,0],[x1,c],[x0,c]],kind,label:K.nm[i]+' · '+c+' €'}); });
  if(o.T!=null){ S.curves.push({type:'hor',p:o.T,col:'var(--rev)',w:2.5,label:(o.lab||'Steuer')+' '+deV(o.T)+' €',lq:0}); S.legend.push(['box','var(--gain-soft);outline:1px solid var(--ok)','vermeidet'],['box','var(--grid);outline:1px solid var(--muted)',o.buy?'kauft Zertifikate':'zahlt Steuer'],['','var(--rev)',(o.lab||'Steuer')+' je Tonne']); }
  else S.legend.push(['box','var(--ps-soft);outline:1px solid var(--dem)','Vermeidungskosten je Tonne']);
  return S;
}
// MC mit Zahlenoptionen
function mcV(R,text,correct,dis,ex,fig,fm=euV){
  const set=[correct]; dis.forEach(d=>{ if(set.length<4&&!set.some(x=>Math.abs(x-d)<1e-9)) set.push(d); });
  let k=1; while(set.length<4){ const d=correct+k*(Math.abs(correct)>=100?50:(Math.abs(correct)>=20?10:5))*(k%2?1:-1); if(!set.some(x=>Math.abs(x-d)<1e-9)) set.push(d); k++; }
  const o=shufV(R,set); return {t:'mc',text,opts:o.map(fm),c:o.findIndex(x=>Math.abs(x-correct)<1e-9),ex,fig};
}
function mcT(R,text,right,wrong,ex,fig){ const o=shufV(R,[right,...wrong]); return {t:'mc',text,opts:o,c:o.indexOf(right),ex,fig}; }

// Inverse Nachfrage P = A − B·Q, Grenzkosten MC = c + d·Q, Fixkosten F
function mono(M){
  const {A,B,c,d}=M, F=M.F||0;
  const Qm=(A-c)/(2*B+d), Pm=A-B*Qm, MCm=c+d*Qm, Qc=(A-c)/(B+d), Pc=A-B*Qc;
  const VC=q=>c*q+d*q*q/2;
  return {Qm,Pm,MCm,Qc,Pc,R:Pm*Qm,CS:0.5*Qm*(A-Pm),PS:Pm*Qm-VC(Qm),NWL:0.5*(Qc-Qm)*(Pm-MCm),
    profit:Pm*Qm-VC(Qm)-F,ATCm:(F+VC(Qm))/Qm,CSc:0.5*Qc*(A-Pc),PSc:Pc*Qc-VC(Qc),VC};
}
const dLin=M=>({type:'lin',a:M.A/M.B,b:-1/M.B,kind:'D',label:'Nachfrage'});
const mrLin=M=>({type:'lin',a:M.A/(2*M.B),b:-1/(2*M.B),kind:'D',col:'var(--el)',label:'MR'});
const mcCurve=M=>M.d>0?{type:'lin',a:-M.c/M.d,b:1/M.d,kind:'S',label:'MC'}:{type:'hor',p:M.c,col:'var(--sup)',label:'MC',lq:0};
const LG11={D:['','var(--dem)','Nachfrage (= Durchschnittserlös)'],MR:['','var(--el)','Grenzerlös MR'],MC:['','var(--sup)','Grenzkosten MC'],ATC:['','var(--un)','Durchschnittskosten ATC'],
  cs:LG7.cs,ps:LG7.ps,nwl:LG7.nwl,pr:['box','var(--rev-soft);outline:1px solid var(--rev)','Monopolgewinn'],R:['box','var(--rev-soft);outline:1px solid var(--rev)','Erlös P · Q']};
function monoScene(o){
  const M=o.M, r=mono(M), S={Pmax:o.Pmax,Qmax:o.Qmax,x:o.x||'Menge',y:o.y||'Preis (€)',curves:[],points:[],rects:[],lines:[],polys:[],extra:'',legend:[],hit:!!o.hit,hitQ:!!o.hit};
  const mcAt=q=>M.c+M.d*q, P=q=>M.A-M.B*q;
  if(o.areas==='kinds'){
    S.polys.push({pts:[[0,M.A],[r.Qm,r.Pm],[0,r.Pm]],kind:'cs',label:'CS'},{pts:[[0,r.Pm],[r.Qm,r.Pm],[r.Qm,r.MCm],[0,M.c]],kind:'ps',label:'PS'},{pts:[[r.Qm,r.Pm],[r.Qc,r.Pc],[r.Qm,r.MCm]],kind:'nwl',label:'NWL'});
    S.legend.push(LG11.cs,LG11.ps,LG11.nwl);
  }
  if(o.areas==='pd'){ S.polys.push({pts:[[0,M.A],[r.Qc,r.Pc],[0,M.c]],kind:'ps',label:'PS'}); S.legend.push(LG11.ps); }
  if(o.areas==='profit'){ S.polys.push({pts:[[0,r.ATCm],[r.Qm,r.ATCm],[r.Qm,r.Pm],[0,r.Pm]],kind:'tax',label:'Gewinn'}); S.legend.push(LG11.pr); }
  if(o.areas==='letters'){
    [['A',[[0,M.A],[r.Qm,r.Pm],[0,r.Pm]]],['B',[[0,r.Pm],[r.Qm,r.Pm],[r.Qm,r.Pc],[0,r.Pc]]],['C',[[r.Qm,r.Pm],[r.Qc,r.Pc],[r.Qm,r.Pc]]],['D',[[r.Qm,r.Pc],[r.Qc,r.Pc],[r.Qm,r.MCm]]],['E',[[0,r.Pc],[r.Qm,r.Pc],[r.Qm,r.MCm],[0,M.c]]]]
      .forEach(l=>S.polys.push({id:l[0],pts:l[1],label:l[0],kind:letterKind(l[0],o.sel,o.checked,o.correct)}));
    S.pickArea=!o.checked;
  }
  if(o.rev&&o.Qsel!=null) S.rects.push({P:P(o.Qsel),Q:o.Qsel,kind:'gain'});
  S.curves.push(dLin(M)); S.legend.unshift(LG11.D);
  if(o.mr!==false){ S.curves.push(mrLin(M)); S.legend.splice(1,0,LG11.MR); }
  if(o.mc!==false){ S.curves.push(mcCurve(M)); S.legend.splice(2,0,LG11.MC); }
  if(o.atc){ const F=M.F||0; S.curves.push({type:'fq',f:q=>F/q+M.c+M.d*q/2,q0:o.Qmax*0.02,col:'var(--un)',label:'ATC',lq:o.Qmax*0.75}); S.legend.push(LG11.ATC); }

// Kapitel 11 im Schnellmodus: jede Rechenaufgabe wird in Multiple-Choice-Fragen zum Kopfrechnen zerlegt
(function(){
  const R=rngV(1111);
  const step=v=>{const a=Math.abs(v); return a>=10000?5000:a>=1000?100:a>=200?50:a>=50?10:a>=10?2:a>=2?1:0.5;};
  const unit=l=>/\(€\)/.test(l)?' €':(/\(%\)/.test(l)?' %':'');
  const clean=l=>l.replace(/\s*\((€|%)\)\s*$/,'');
  LV11.forEach(L=>{ L.pool=L.T.filter(t=>t.t!=='calc'); L.T=L.T.flatMap(t=>{
    if(t.t!=='calc') return [t];
    return t.fields.map((f,i)=>{
      const c=f[1], s=step(c), cand=[];
      t.fields.forEach((g,j)=>{ const d=g[1]; if(j!==i&&(c===0||(d!==0&&Math.abs(d/c)>=0.25&&Math.abs(d/c)<=4))) cand.push(d); });
      cand.push(c*2,c/2,c+s,c-s,c*1.5,c+2*s,-c);
      const opts=[c];
      for(const d of cand){ if(opts.length>=4) break; if(!isFinite(d)) continue; if(Number.isInteger(c)&&!Number.isInteger(d*2)) continue; if(opts.some(o=>Math.abs(o-d)<1e-6)) continue; if(c>0&&d<0&&!t.fields.some(g=>g[1]<0)) continue; opts.push(d); }
      const o=shufV(R,opts), u=unit(f[0]);
      const pre=t.fields.length>1?`<span class="hint" style="display:block;margin-top:8px">Teil ${i+1} von ${t.fields.length}</span>`:'';
      const fo=t.formula?`<span class="hint" style="display:block;margin-top:4px">Hilfe: ${t.formula.join(' · ')}</span>`:'';
      return {t:'mc',text:`${t.text}${pre}<b style="display:block;margin-top:6px">Gesucht: ${clean(f[0])}</b>${fo}`,opts:o.map(v=>fmt(v)+u),c:o.findIndex(v=>Math.abs(v-c)<1e-6),ex:t.ex,fig:t.fig};
    });
  }); });
})();
// Kapitel 11: „Neue Zahlen“ – Zufallsrunden mit Kopfrechen-MC plus Verständnisfragen aus dem Pool
(function(){
  const qf=x=>deV(x), ef=x=>euV(x);
  // Mehrteilige Kette aus einem Fall
  function chain(R,intro,items,ex,fig){
    return items.map((it,i)=>{ const t=mcV(R,`${intro}<span class="hint" style="display:block;margin-top:8px">Teil ${i+1} von ${items.length}</span><b style="display:block;margin-top:6px">Gesucht: ${it[0]}</b>${it[4]?`<span class="hint" style="display:block;margin-top:4px">Hilfe: ${it[4]}</span>`:''}`,it[1],it[2],ex,fig,it[3]||ef); return t; });
  }
  // Monopolmarkt mit ganzzahliger Monopol- und Konkurrenzmenge: P = A − BQ, MC = c + dQ
  const COMB=[[1,0,2],[1,1,6],[2,0,4],[1,2,12],[2,2,12]];
  function mkt(R,o={}){
    for(let k=0;k<500;k++){
      const [B,d,l]=o.d===0?pickV(R,COMB.filter(x=>x[1]===0)):(o.d>0?pickV(R,COMB.filter(x=>x[1]>0)):pickV(R,COMB));
      const c=pickV(R,[0,2,4,5,6,8,10,12,20]), K=l*pickV(R,[1,2,3,4,5,6,8,10]), A=c+K;
      if(A<12||A>160) continue;
      const M={A,B,c,d}, r=mono(M); if(r.Qm<2) continue;
      return {M,r,txt:`Inverse Nachfrage P = ${A} − ${B===1?'':B}Q, Grenzkosten ${d?`MC = ${c} + ${d===1?'':d}Q`:`konstant ${c} €`}.`,
        fig:k=>monoScene({M,Pmax:A*1.08,Qmax:A/B*1.03,showM:k>0,showC:k>0,areas:k>0?'kinds':null,labels:1})};
    }
  }
  const T11={
    natur:R=>{ const Q=pickV(R,[100,200,250,400,500]), f=pickV(R,[1,2,3,4,5]), F=Q*f, c=pickV(R,[1,2,3,5]);
      return chain(R,`Natürliches Monopol: Fixkosten ${ef(F)}, konstante Grenzkosten ${c} €. Der Markt fragt ${Q} Einheiten nach.`,
       [[`Durchschnittskosten, wenn ein Unternehmen alle ${Q} herstellt`,f+c,[2*f+c,f,F/Q*c]],[`Durchschnittskosten, wenn sich zwei Unternehmen den Markt teilen`,2*f+c,[f+c,f/2+c,4*f+c]]],
       `Ein Unternehmen: ${ef(F)}/${Q} + ${c} = ${ef(f+c)}. Zwei Unternehmen tragen je die vollen Fixkosten: ${ef(F)}/${Q/2} + ${c} = ${ef(2*f+c)}. Deshalb produziert ein einzelnes Unternehmen billiger.`); },
    tabelle:R=>{ const A=pickV(R,[8,9,10,11,12,13,14,15]), q=2+Math.floor(R()*(A/2-2)), P=A-q, P2=A-q-1;
      return chain(R,`Nachfrage P = ${A} − Q (Tabellen-Beispiel wie beim Wasser).`,
       [[`Gesamterlös bei Q = ${q}`,P*q,[P,q*(P+1),(P-1)*(q+1)]],[`Durchschnittserlös bei Q = ${q}`,P,[P*q,P-1,A]],[`Grenzerlös von Q = ${q} auf Q = ${q+1}`,P2*(q+1)-P*q,[P2,P,-(P2*(q+1)-P*q)]]],
       `R(${q}) = ${P} · ${q} = ${P*q}, AR = P = ${P}. R(${q+1}) = ${P2} · ${q+1} = ${P2*(q+1)}. Grenzerlös: ${P2*(q+1)} − ${P*q} = ${P2*(q+1)-P*q}. Er liegt unter dem Preis ${P2}, weil alle bisherigen Einheiten billiger werden.`,
       k=>monoScene({M:{A,B:1,c:0,d:0},Pmax:A*1.08,Qmax:A*1.03,mc:false,mr:k>0})); },
    mrform:R=>{ const B=pickV(R,[1,2,3,4,5]), A=2*B*pickV(R,[5,6,8,10,12,15,20]); const right=`MR = ${A} − ${2*B}Q`;
      const o=shufV(R,[right,`MR = ${A} − ${B===1?'':B}Q`,`MR = ${A/2} − ${B===1?'':B}Q`,`MR = ${2*A} − ${2*B}Q`]);
      return [{t:'mc',text:`Die inverse Nachfrage lautet P = ${A} − ${B===1?'':B}Q. Wie lautet der Grenzerlös?`,opts:o,c:o.indexOf(right),ex:`R = ${A}Q − ${B===1?'':B}Q². Ableiten: ${right}. Gleicher Achsenabschnitt, doppelte Steigung.`},
        mcV(R,`P = ${A} − ${B===1?'':B}Q. Bei welcher Menge ist der Gesamterlös maximal (MR = 0)?`,A/(2*B),[A/B,A/(4*B),A/2],`MR = ${A} − ${2*B}Q = 0 ⇒ Q = ${A/(2*B)}. Dort ist die Nachfrage einheitselastisch.`,null,qf)]; },
    gewinn:R=>{ const m=mkt(R), {M,r}=m, f=pickV(R,[2,3,4,5,10]), F=f*r.Qm, ATC=f+M.c+M.d*r.Qm/2, prof=(r.Pm-ATC)*r.Qm;
      return chain(R,`${m.txt} Fixkosten ${ef(F)}.`,
       [[`Gewinnmaximierende Menge`,r.Qm,[r.Qc,M.A/(2*M.B),r.Qm*2],qf,'MR = MC'],[`Monopolpreis`,r.Pm,[r.MCm,r.Pc,M.A-2*M.B*r.Qm]],[`Grenzerlös = Grenzkosten im Optimum`,r.MCm,[r.Pm,r.Pc,M.c]],[`Durchschnittskosten ATC`,ATC,[ATC+f,M.c,r.MCm]],[`Gewinn`,prof,[r.Pm*r.Qm,prof+F,(r.Pm-r.MCm)*r.Qm]]],
       `MR = ${M.A} − ${2*M.B}Q = MC ⇒ Q = ${qf(r.Qm)}. Preis aus der Nachfrage: ${M.A} − ${M.B} · ${qf(r.Qm)} = ${qf(r.Pm)}. MR = MC = ${qf(r.MCm)}. ATC = ${ef(F)}/${qf(r.Qm)} + ${M.c}${M.d?` + ${M.d/2} · ${qf(r.Qm)}`:''} = ${qf(ATC)}. Gewinn = (${qf(r.Pm)} − ${qf(ATC)}) · ${qf(r.Qm)} = ${ef(prof)}.`,
       k=>monoScene({M:{...M,F},Pmax:M.A*1.08,Qmax:M.A/M.B*1.03,showM:1,atc:1,areas:k>0?'profit':null,labels:1})); },
    preis:R=>{ const m=mkt(R), {M,r}=m; return chain(R,m.txt,[[`Monopolmenge`,r.Qm,[r.Qc,M.A/(2*M.B),r.Qm+2],qf],[`Monopolpreis (wo wird er abgelesen?)`,r.Pm,[r.MCm,M.A-2*M.B*r.Qm,r.Pc]]],
       `Menge bei MR = MC: ${qf(r.Qm)}. Den Preis liest du senkrecht darüber auf der Nachfrage ab: ${qf(r.Pm)}. Falsch wäre ${qf(r.MCm)} (auf MR bzw. MC abgelesen).`,m.fig); },
    wohl:R=>{ const m=mkt(R), {M,r}=m;

  o.L.forEach((l,i)=>{ const col=l.col||C17[i];
    if(o.fill) S.polys.push({pts:[[0,0],[l.x,0],[0,l.y]],kind:i?'neutral':'ps'});
    S.curves.push({type:'lin',a:l.x,b:-l.x/l.y,col,kind:i?'S':'D',label:l.n,lq:o.lq?o.lq[i]:null,w:3});
    S.legend.push(['',col,'PMK '+l.n]); });
  (o.trade||[]).forEach(t=>{ S.curves.push({type:'lin',a:t.a,b:t.b,col:'var(--rev)',dash:1,w:2.5,label:t.label||''}); });
  if(o.trade&&o.trade.length) S.legend.push(['','var(--rev)','Tauschgerade (Konsum mit Handel)']);
  (o.pts||[]).forEach(p=>S.points.push({P:p.y,Q:p.x,guides:1,tags:p.tags!==false,label:p.label||'',col:p.col,hollow:p.hollow}));
  return S;
}
